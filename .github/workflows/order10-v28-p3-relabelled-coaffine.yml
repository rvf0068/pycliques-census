name: Deterministic seeded P3 coaffine positive search on 511 ten-classes

on:
  pull_request:
    paths:
      - "research/order10_v28_p3_relabelled_coaffine_v1/**"
      - "research/order10_v28_p3_coaffine_all_v1/**"
      - "research/order10_three_p3_coaffine_native_v1/**"
      - "research/order10_five_p3_native_v1/**"
      - "indeterminate_order_10_v25.txt"
      - "indeterminate_order_10_v28.txt"
      - ".github/workflows/order10-v28-p3-relabelled-coaffine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-immutable-511-class-P3-source-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - name: Rebuild 511 exact surviving P3 class representatives
        run: |
          python -m research.order10_v28_p3_coaffine_all_v1.index \
            --output "$RUNNER_TEMP/p3-source-index.json" \
            | tee "$RUNNER_TEMP/index.log"
          grep -q '^PASS: exact current ten-v28 P3 coaffine source index' "$RUNNER_TEMP/index.log"
      - uses: actions/upload-artifact@v4
        with:
          name: seeded-511-P3-source-index
          path: ${{ runner.temp }}/p3-source-index.json
          retention-days: 90
          if-no-files-found: error

  eight-native-relabeling-search-shards:
    needs: build-immutable-511-class-P3-source-index
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: e27649a6898b8c5b5bdbb4c6c64fd792672ae0ae
          path: monorepo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned monorepo native coaffine implementation
        run: |
          python -m pip install -r research/order10_five_p3_native_v1/constraints.txt
          python -m pip install -c research/order10_five_p3_native_v1/constraints.txt "./monorepo/packages/pycliques"
          python -m pip check
      - name: Pin native source revision and build existing C++ solver
        run: |
          set -euo pipefail
          SHA="$(git -C monorepo rev-parse HEAD)"
          test "$SHA" = e27649a6898b8c5b5bdbb4c6c64fd792672ae0ae
          echo "PYCLIQUES_PINNED_SHA=$SHA" >> "$GITHUB_ENV"
          python -m pycliques.octahedral_coaffine_native --build
      - uses: actions/download-artifact@v4
        with:
          name: seeded-511-P3-source-index
          path: ${{ runner.temp }}/index
      - name: Search three deterministic shuffles and two native policies per source
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -m research.order10_v28_p3_relabelled_coaffine_v1.search \
            --index "$RUNNER_TEMP/index/p3-source-index.json" \
            --shard "$SHARD" \
            --output "$RUNNER_TEMP/p3-relabelled-coaffine-shard-$SHARD.json" \
            | tee "$RUNNER_TEMP/native.log"
          grep -q '^PASS: deterministic relabeling shard' "$RUNNER_TEMP/native.log"
      - uses: actions/upload-artifact@v4
        with:
          name: seeded-511-P3-native-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/p3-relabelled-coaffine-shard-${{ matrix.shard }}.json
          retention-days: 90
          if-no-files-found: error

  independent-all-positive-certificate-replay:
    needs: eight-native-relabeling-search-shards
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - uses: actions/download-artifact@v4
        with:
          name: seeded-511-P3-source-index
          path: ${{ runner.temp }}/index
      - uses: actions/download-artifact@v4
        with:
          pattern: seeded-511-P3-native-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Rebuild original P3 for all FOUND and independently verify every map
        run: |
          python -m research.order10_v28_p3_relabelled_coaffine_v1.verify \
            --index "$RUNNER_TEMP/index/p3-source-index.json" \
            --directory "$RUNNER_TEMP/shards" \
            --output "$RUNNER_TEMP/seeded-positive-audit.json" \
            | tee "$RUNNER_TEMP/verify.log"
          grep -q '^PASS: all 3066 seeded native P3 coaffine outcomes' "$RUNNER_TEMP/verify.log"
      - uses: actions/upload-artifact@v4
        with:
          name: seeded-511-P3-independent-positive-retraction-audit
          path: ${{ runner.temp }}/seeded-positive-audit.json
          retention-days: 90
          if-no-files-found: error

  reproducible-seed-and-proof-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - name: Check deterministic graph-preserving shuffle and mathematical theorem tests
        run: |
          python -m compileall -q research/order10_v28_p3_relabelled_coaffine_v1
          python -m unittest research.order10_v28_p3_relabelled_coaffine_v1.test_verify -v
      - name: Reject optimized solver-independent positive replay
        run: |
          set -euo pipefail
          if python -O -m research.order10_v28_p3_relabelled_coaffine_v1.verify \
             --index /tmp/nonexistent --directory /tmp \
             --output /tmp/nonexistent.json > "$RUNNER_TEMP/opt.log" 2>&1; then
            echo "Optimized proof unexpectedly accepted"; exit 1
          fi
          grep -q 'Cannot optimize away seeded coaffine positive replay' "$RUNNER_TEMP/opt.log"
