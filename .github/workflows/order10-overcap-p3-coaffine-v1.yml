name: Pilot native pycliques coaffine search on ten oversized P3 cores

on:
  pull_request:
    paths:
      - "research/order10_overcap_p3_coaffine_v1/**"
      - "research/order10_full_nine_reference_v1/**"
      - "research/order10_p4_203_ears_v1/**"
      - "research/order10_p3_global_v23_index/**"
      - "indeterminate_order_10_v25.txt"
      - ".github/workflows/order10-overcap-p3-coaffine-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  degree-obstructions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - name: Verify ten original P3 sources and degree-based impossibility of coaffine automorphisms
        run: |
          python -m unittest research.order10_overcap_p3_coaffine_v1.test_pilot -v
      - name: Compile proof scripts
        run: |
          python -m compileall -q research/order10_overcap_p3_coaffine_v1

  native-probe:
    needs: degree-obstructions
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out census sources
        uses: actions/checkout@v4
      - name: Check out pinned official pycliques monorepo
        uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: f8eb9b9f2c71d79f9394571df98155f9de568785
          path: monorepo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official pycliques without modifying the monorepo
        run: |
          python -m pip install "./monorepo/packages/pycliques"
      - name: Pin monorepo identity and explicitly build its optional C++ native solver
        run: |
          set -euo pipefail
          SHA="$(git -C monorepo rev-parse HEAD)"
          test "$SHA" = f8eb9b9f2c71d79f9394571df98155f9de568785
          echo "PYCLIQUES_PINNED_SHA=$SHA" >> "$GITHUB_ENV"
          python -m pycliques.octahedral_coaffine_native --build
      - name: Search bounded coaffine endomorphisms and octahedral retractions
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -m research.order10_overcap_p3_coaffine_v1.pilot \
            --shard "$SHARD" --shards 5 --max-states 100000 \
            --time-limit 25 \
            --output "$RUNNER_TEMP/shard-$SHARD.json" \
            | tee "$RUNNER_TEMP/log-$SHARD.txt"
          grep -q "^PASS: authenticated native pycliques P3 pilot" \
            "$RUNNER_TEMP/log-$SHARD.txt"
          test "$(grep -c '^McKay=' "$RUNNER_TEMP/log-$SHARD.txt")" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: p3-overcap-coaffine-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
          retention-days: 30
          if-no-files-found: error

  aggregate:
    needs: [degree-obstructions, native-probe]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - uses: actions/download-artifact@v4
        with:
          pattern: p3-overcap-coaffine-shard-*
          path: ${{ runner.temp }}/native
          merge-multiple: true
      - name: Independently authenticate source graphs and replay all positive morphisms
        run: |
          python -m research.order10_overcap_p3_coaffine_v1.aggregate \
            --directory "$RUNNER_TEMP/native" \
            --output "$RUNNER_TEMP/full-p3-coaffine-pilot.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p3-overcap-ten-coaffine-full-summary
          path: ${{ runner.temp }}/full-p3-coaffine-pilot.json
          retention-days: 30
          if-no-files-found: error
