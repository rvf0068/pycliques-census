name: Certify order-nine v7 and order-ten v18 promotion (6 and 1681)

on:
  pull_request:
    paths:
      - "indeterminate_order_9.txt"
      - "indeterminate_order_9_v6.txt"
      - "indeterminate_order_9_v7.txt"
      - "indeterminate_order_10.txt"
      - "indeterminate_order_10_v17.txt"
      - "indeterminate_order_10_v18.txt"
      - "research/order9_v7_order10_v18/**"
      - "research/order9_three_p4_retractions_v1/**"
      - "tests/test_current_root_index.py"
      - ".github/workflows/order9-v7-order10-v18.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-exact-promotion:
    name: Recompute all 344 ten-core isomorphisms, immutable source digests, and v7/v18 delta
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Exact original-index promotion and current-root regression
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile research/order9_v7_order10_v18/verify.py research/order9_v7_order10_v18/replay_v17.py
          python -m research.order9_v7_order10_v18.verify
          python -m unittest discover -s tests -p test_current_root_index.py -v
      - name: Reject bypass of proof-critical assertions
        run: |
          stdout_file=$(mktemp)
          stderr_file=$(mktemp)
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT
          if python -O -m research.order9_v7_order10_v18.verify >"$stdout_file" 2>"$stderr_file"; then
            echo "ERROR: optimized proof verification unexpectedly succeeded"
            exit 1
          else
            status=$?
          fi
          if [ "$status" -ne 1 ] || ! grep -Fxq 'RuntimeError: Optimized Python bypasses proof-critical assertions' "$stderr_file"; then
            echo "ERROR: unexpected optimized verification failure ($status)"
            cat "$stdout_file"
            cat "$stderr_file" >&2
            exit 1
          fi

  certified-source-replay:
    name: Independently reconstruct P4-to-O10/O12/O14 positive maps and 344 lifts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Recheck all three full projection certificates and the promotion audit
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order9_v7_order10_v18.verify --proofs

  archived-v17-replay:
    name: Historical nine-v6 / ten-v17 original proof and residual-class replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Replay archived v6/v17 with immutable input substitution
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order9_v7_order10_v18.replay_v17 --families --surfaces
