name: Exhaustive octahedral-retraction audit of six residual flag spheres

on:
  pull_request:
    paths:
      - "indeterminate_order_10_v17.txt"
      - "research/order10_sphere_octahedral_exhaustive_v1/**"
      - ".github/workflows/order10-sphere-octahedral-exhaustive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-networkx:
    name: All six P3 and 10803453 P4 complete searches
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent NetworkX
        run: python -m pip install networkx==3.6.1
      - name: Compile and replay all finite negative certificates
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile research/order10_sphere_octahedral_exhaustive_v1/verify.py
          python research/order10_sphere_octahedral_exhaustive_v1/verify.py --self-test --fourth
      - name: Reject optimized-Python bypass
        run: |
          if python -O research/order10_sphere_octahedral_exhaustive_v1/verify.py; then
            echo "ERROR: optimized proof replay unexpectedly passed"
            exit 1
          fi

  public-pycliques-crosscheck:
    name: Public pycliques replay of all six P3 and the exact P4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen public pycliques revision
        run: |
          python -m pip install networkx==3.6.1
          git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project
          git -C /tmp/pycliques-project checkout --quiet 782deb653b8748e1b5759389cdd2134beac69351
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Check all intermediate structures and replay all exclusions
        env:
          PYTHONHASHSEED: "0"
        run: python research/order10_sphere_octahedral_exhaustive_v1/verify.py --public --fourth
