name: Independently certify new O12 fourth-iterate retraction and v13
on:
  pull_request:
    paths:
      - "research/order10_o12_dim_v13/**"
      - "indeterminate_order_10_v12.txt"
      - "indeterminate_order_10_v13.txt"
      - "indeterminate_order_10.txt"
      - "tests/test_current_root_index.py"
      - ".github/workflows/order10-o12-dim-v13.yml"
  push:
    paths:
      - "research/order10_o12_dim_v13/**"
      - "indeterminate_order_10_v12.txt"
      - "indeterminate_order_10_v13.txt"
      - "indeterminate_order_10.txt"
      - ".github/workflows/order10-o12-dim-v13.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independently-replay-single-o12-and-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent verifier
        run: python -m pip install networkx==3.6.1
      - name: Independently reconstruct, check map, and audit exactly one removal
        run: python -m research.order10_o12_dim_v13.replay_v13
      - name: Recheck current-root invariants
        run: python -m unittest discover -s tests -p test_current_root_index.py -v
