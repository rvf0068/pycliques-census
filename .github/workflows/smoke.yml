name: Connected census smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'postpasses/**'
      - 'config/**'
      - '.github/workflows/smoke.yml'
      - 'indeterminate_order_9.txt'
      - 'indeterminate_order_9_v1.txt'
      - 'indeterminate_order_9_v2.txt'
      - 'indeterminate_order_9_v3.txt'
      - 'indeterminate_order_9_v4.txt'
      - 'research/order9_current_indeterminates_v2/**'
      - 'research/snub_promotion_v1/**'
      - 'runs/order9/**'
      - '.devcontainer/**'
      - 'README.md'
jobs:
  census-through-six:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test resumable high-order stream bookkeeping
        run: |
          bash scripts/bootstrap.sh
          .venv/bin/python -m compileall -q scripts tests postpasses
          # The current working root is v23 (1,059 graphs). Run its
          # consistency tests before the legacy snapshot replays.
          # Older stage tests still use the immutable 8,648-case pre-v3 index.
          .venv/bin/python -m unittest discover -s tests \
            -p test_current_root_index.py -v
          # Also replay the frozen 49-case order-nine v2 transition.
          .venv/bin/python research/snub_promotion_v1/replay_historical.py --order 9
          # The archived four-O4 verifier requires the frozen v8 root.
          cp indeterminate_order_10.txt /tmp/current-v23-pre-smoke
          cp indeterminate_order_10_v8.txt indeterminate_order_10.txt
          .venv/bin/python -m unittest discover -s tests \
            -p test_order10_four_o4_lift_v1.py -v
          cp /tmp/current-v23-pre-smoke indeterminate_order_10.txt
          current_root="$(mktemp)"
          current_order9="$(mktemp)"
          cp indeterminate_order_10.txt "$current_root"
          cp indeterminate_order_9.txt "$current_order9"
          restore_roots() {
            cp "$current_root" indeterminate_order_10.txt
            cp "$current_order9" indeterminate_order_9.txt
          }
          trap restore_roots EXIT
          # These old tests reconstruct the 54-case stage output, NOT the
          # modern 13-case order-nine index. Use its immutable v1 snapshot.
          cp indeterminate_order_9_v1.txt indeterminate_order_9.txt
          cp historical/indeterminate_order_10_pre_v3.txt indeterminate_order_10.txt
          .venv/bin/python - <<'PY'
          import sys
          import unittest

          all_tests = unittest.defaultTestLoader.discover("tests")

          def historical_tests(suite):
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      yield from historical_tests(test)
                  elif not test.id().startswith((
                      "test_current_root_index.",
                      "test_order10_four_o4_lift_v1.",
                  )):
                      yield test

          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.TestSuite(historical_tests(all_tests))
          )
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
          restore_roots
          trap - EXIT
          rm "$current_root" "$current_order9"
          .venv/bin/python -m unittest discover -s tests \
            -p test_current_root_index.py -v
          .venv/bin/python research/snub_promotion_v1/replay_historical.py --order 9
          bash scripts/stage.sh baseline
      - name: Reproduce the connected census through order 6
        run: MAX_ORDER=6 BATCH_SIZE=100 RUN_DIR="$PWD/runs/ci-order6" bash scripts/run_census.sh
