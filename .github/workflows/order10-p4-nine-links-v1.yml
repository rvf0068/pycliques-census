name: Certify four more exact ten-to-nine fourth-iterate dependencies

on:
  pull_request:
    paths:
      - "research/order10_p4_nine_links_v1/**"
      - "research/order10_nine_core_dependency_v1/**"
      - "research/order10_p3_global_v23_index/**"
      - "research/order10_p4_cap_rescue_v24/**"
      - "indeterminate_order_9_v9.txt"
      - "indeterminate_order_9.txt"
      - "indeterminate_order_10_v25.txt"
      - "indeterminate_order_10.txt"
      - ".github/workflows/order10-p4-nine-links-v1.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-positive-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned graph dependency
        run: python -m pip install networkx==3.6.1
      - name: Syntax and adversarial map/provenance tests
        run: |
          python -m py_compile research/order10_p4_nine_links_v1/verify.py
          python -m py_compile research/order10_p4_nine_links_v1/test_verify.py
          python -m unittest research.order10_p4_nine_links_v1.test_verify -v
      - name: Independently reconstruct all P4s and check every coordinate and pair
        run: python -m research.order10_p4_nine_links_v1.verify
      - name: Preserve exact current nine-v9 and ten-v25 indices
        run: python -m unittest discover -s tests -p test_current_root_index.py -v
      - name: Reject optimized Python proof replay
        run: |
          if python -O -m research.order10_p4_nine_links_v1.verify >/tmp/p4-nine-optimized.log 2>&1; then
            echo "Optimized Python erroneously accepted the proof"; exit 1
          fi
          grep -q "Optimized Python bypasses proof-critical assertions" /tmp/p4-nine-optimized.log
