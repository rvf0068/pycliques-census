name: Certify conditional nine-core links to 66 stiff ten-vertex graphs

on:
  pull_request:
    paths:
      - "research/order10_nine_core_dependency_v1/**"
      - "research/order10_p3_global_v23_index/**"
      - "research/order10_p4_cap_rescue_v24/**"
      - "indeterminate_order_9_v9.txt"
      - "indeterminate_order_9.txt"
      - "indeterminate_order_10_v25.txt"
      - "indeterminate_order_10.txt"
      - "indeterminate_order_10_v28.txt"
      - "indeterminate_order_10_v29.txt"
      - "indeterminate_order_10_v30.txt"
      - "indeterminate_order_9_v10.txt"
      - ".github/workflows/order10-nine-core-dependency-v1.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-positive-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent pinned graph dependency
        run: python -m pip install networkx==3.6.1
      - name: Compile exact proof and run mutation tests
        run: |
          python -m py_compile research/order10_nine_core_dependency_v1/verify.py
          python -m py_compile research/order10_nine_core_dependency_v1/test_verify.py
          python -m unittest research.order10_nine_core_dependency_v1.test_verify -v
      - name: Independently reconstruct historical dependencies against immutable v25 root
        run: |
          set -euo pipefail
          test "$(git hash-object indeterminate_order_10_v25.txt)" = d31d52d28427adcef6055cc1d277565fe88f32d5
          cmp indeterminate_order_10.txt indeterminate_order_10_v30.txt
          cp indeterminate_order_9_v9.txt indeterminate_order_9.txt
          trap 'cp indeterminate_order_10_v30.txt indeterminate_order_10.txt' EXIT
          cp indeterminate_order_10_v25.txt indeterminate_order_10.txt
          python -m research.order10_nine_core_dependency_v1.verify
      - name: Confirm v30 active root and nine-v10 restored after historical verification
        run: |
          cp indeterminate_order_9_v10.txt indeterminate_order_9.txt
          cmp indeterminate_order_9.txt indeterminate_order_9_v10.txt
          cmp indeterminate_order_10.txt indeterminate_order_10_v30.txt
      - name: Current exact root audit
        run: |
          python -m unittest discover -s tests -p test_current_root_index.py -v
      - name: Proof-critical assertions must not be optimized away
        run: |
          if python -O -m research.order10_nine_core_dependency_v1.verify >/tmp/dependency-optimized.log 2>&1; then
            echo "Optimized Python erroneously accepted the positive proof"
            exit 1
          fi
          grep -q "Optimized Python bypasses proof-critical checks" /tmp/dependency-optimized.log
