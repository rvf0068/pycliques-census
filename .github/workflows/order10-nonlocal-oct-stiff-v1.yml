name: Bounded octahedral retraction search on stiff order-ten cores
on:
  pull_request:
    paths:
      - "research/order10_nonlocal_oct_stiff_v1/**"
      - ".github/workflows/order10-nonlocal-oct-stiff-v1.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Cores per shard (0 = all 1043 cores)"
        required: true
        default: "24"
        type: string

permissions:
  contents: read

jobs:
  positive-only-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned libraries and pycliques-project
        run: |
          python -m pip install networkx==3.6.1
          git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project
          git -C /tmp/pycliques-project checkout --quiet 7ae36ffe67fb2e9bbafc68e97347aabcf757c2dc
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Check script syntax and pinned census selection
        run: |
          python -m compileall -q research/order10_nonlocal_oct_stiff_v1/
          python research/order10_nonlocal_oct_stiff_v1/sweep.py plan --shard ${{ matrix.shard }} --shards 8 --limit "${{ inputs.limit || '24' }}"
      - name: Run bounded per-core experiments
        run: |
          python research/order10_nonlocal_oct_stiff_v1/sweep.py run \
            --shard ${{ matrix.shard }} --shards 8 --limit "${{ inputs.limit || '24' }}" \
            --max-depth 3 --bound 450 --dimensions 3,4,5,6,8,10 \
            --restarts 160 --states 1200 --timeout-sec 8 \
            --output "$RUNNER_TEMP/order10-shard-${{ matrix.shard }}.json"
      - name: Independently replay every found retraction
        run: |
          python research/order10_nonlocal_oct_stiff_v1/sweep.py verify \
            --input-results "$RUNNER_TEMP/order10-shard-${{ matrix.shard }}.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"order10-shard-${{ matrix.shard }}.json"
          records=json.loads(p.read_text())["records"]
          positives=[(r["index"],r["certificate"]["depth"]) for r in records if r["status"]=="CERTIFIED_DIVERGENT"]
          counts={status:sum(r["status"]==status for r in records) for status in ("CERTIFIED_DIVERGENT","INCONCLUSIVE","TIMEOUT","ERROR")}
          print("SEARCH_SUMMARY", json.dumps({"counts":counts,"positives":positives}))
          if counts["ERROR"]: raise SystemExit("Explicit ERROR results in shard; inspect artifact")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order10-stiff-octahedral-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/order10-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
