name: Exact order-nine P4 complement-domination dual certificates

on:
  pull_request:
    paths:
      - "indeterminate_order_9_v7.txt"
      - "research/order9_p4_domination_dual_v1/**"
      - ".github/workflows/order9-p4-domination-dual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-integer-proof:
    name: Independently reconstruct P4 and verify every integer dual inequality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent graph library
        run: python -m pip install networkx==3.6.1
      - name: Rebuild all P4 graphs and verify exact integer certificates
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile research/order9_p4_domination_dual_v1/verify.py
          python research/order9_p4_domination_dual_v1/verify.py
      - name: Reject unrelated failures masquerading as optimized-code guard
        run: |
          stdout_file=$(mktemp)
          stderr_file=$(mktemp)
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT
          if python -O research/order9_p4_domination_dual_v1/verify.py >"$stdout_file" 2>"$stderr_file"; then
            echo "ERROR: optimized verifier was accepted"
            exit 1
          else
            status=$?
          fi
          if [ "$status" -ne 1 ] || ! grep -Fxq 'RuntimeError: Optimized Python bypasses proof-critical assertions' "$stderr_file"; then
            echo "ERROR: unrelated optimized verifier failure ($status)"
            cat "$stdout_file"
            cat "$stderr_file" >&2
            exit 1
          fi

  public-pycliques-stages:
    name: Public pycliques stage-by-stage comparison and integer certificate replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: d140bd3a666ca6abf77e5823740ecef85e75a842
          path: pycliques-dependency
          persist-credentials: false
      - name: Install frozen public pycliques and independent NetworkX
        run: |
          python -m pip install networkx==3.6.1
          python -m pip install ./pycliques-dependency/packages/pycliques
      - name: Verify public/independent clique graphs and parings at all four stages
        env:
          PYTHONHASHSEED: "0"
        run: python research/order9_p4_domination_dual_v1/verify.py --public
