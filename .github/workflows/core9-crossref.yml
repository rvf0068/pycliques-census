name: Core9 historical cross-reference

on:
  pull_request:
    paths:
      - "scripts/core9_crossref.py"
      - "tests/test_core9_crossref.py"
      - ".github/workflows/core9-crossref.yml"
      - "scripts/core_isomorphism_index.py"
      - "config/pycliques_commit_v3.txt"
      - "scripts/bootstrap_v3.sh"
      - "reports/order10_core_index_v1/**"
      - "runs/order9/**"
      - "indeterminate_order_9.txt"
      - "indeterminate_order_10.txt"
      - "indeterminate_order_10_v12.txt"
      - "indeterminate_order_10_v13.txt"
      - "indeterminate_order_10_v14.txt"
      - "indeterminate_order_9_v4.txt"
      - "indeterminate_order_9_v6.txt"
      - "indeterminate_order_10_v17.txt"
      - "indeterminate_order_10_v23.txt"
      - "indeterminate_order_10_v24.txt"
      - "indeterminate_order_10_v25.txt"
  workflow_dispatch:

jobs:
  cross-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore archived pre-v3 order-ten input for cross-reference replay
        run: cp historical/indeterminate_order_10_pre_v3.txt indeterminate_order_10.txt
      - name: Restore frozen 54-case order-nine input for historical replay
        run: cp indeterminate_order_9_v1.txt indeterminate_order_9.txt
      - uses: astral-sh/setup-uv@v4
      - name: Prepare unchanged pinned historical witness environment
        run: bash scripts/bootstrap_v3.sh
      - name: Check exact matches, historical stage provenance and immutability
        run: .venv-v3/bin/python -m unittest discover -s tests -p test_core9_crossref.py -v
      - name: Build and verify complete order-nine cross-reference
        run: |
          .venv-v3/bin/python scripts/core9_crossref.py build --output reports/ci-core9-crossref
          .venv-v3/bin/python scripts/core9_crossref.py verify --output reports/ci-core9-crossref
          cat reports/ci-core9-crossref/summary.md
      - name: Restore current nine-vertex v9 working index
        run: cp indeterminate_order_9_v9.txt indeterminate_order_9.txt
      - name: Restore current ten-vertex v26 working root
        run: cp indeterminate_order_10_v26.txt indeterminate_order_10.txt
      - name: Assert historical archives unchanged and the current root restored to v26
        run: |
          cmp indeterminate_order_9.txt indeterminate_order_9_v9.txt
          cmp indeterminate_order_10.txt indeterminate_order_10_v26.txt
          test "$(git hash-object indeterminate_order_10_v25.txt)" = d31d52d28427adcef6055cc1d277565fe88f32d5
          git diff --exit-code -- runs/order9/ runs/order10/ indeterminate_order_9.txt indeterminate_order_10.txt indeterminate_order_10_v3.txt reports/order10_core_index_v1/
      - uses: actions/upload-artifact@v4
        with:
          name: order10-core9-historical-crossref
          path: reports/ci-core9-crossref/
          if-no-files-found: error
