name: Recover three last nine-vertex P4 octahedral retraction proofs

on:
  pull_request:
    paths:
      - "research/order9_last_three_incidence_v1/**"
      - ".github/workflows/order9-last-three-incidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-three-full-original-P4-projections:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        index: [249576, 251628, 260040]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the merged incidence native solvers, not an unreviewed implementation
        uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: e1e9ed04f5c1f962a5f7e70312fb8df16e5a6a78
          path: monorepo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public pycliques and numerical graph dependencies
        run: |
          python -m pip install "./monorepo/packages/pycliques"
          python -m pip install networkx==3.6.1
          python -m pip check
      - name: Build both existing C++ native solvers and verify source revision
        run: |
          set -euo pipefail
          SHA="$(git -C monorepo rev-parse HEAD)"
          test "$SHA" = e1e9ed04f5c1f962a5f7e70312fb8df16e5a6a78
          python -m pycliques.octahedral_coaffine_native --build
          python -m pycliques.octahedral_incidence_native --build
      - name: Produce full octahedral P4 projection from original graph6
        env:
          NINE_INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          python -m research.order9_last_three_incidence_v1.discover \
            --index "$NINE_INDEX" \
            --output "$RUNNER_TEMP/order9-last-three-$NINE_INDEX.json" \
            | tee "$RUNNER_TEMP/discovery.log"
          grep -q '^PASS: nine-original fourth-iterate complete source audited' \
            "$RUNNER_TEMP/discovery.log"
      - uses: actions/upload-artifact@v4
        with:
          name: order9-last-three-original-${{ matrix.index }}-full-projection
          path: ${{ runner.temp }}/order9-last-three-${{ matrix.index }}.json
          if-no-files-found: error
          retention-days: 90

  verify-exact-500-ten-original-conditional-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - name: Derive 430 original pared-nine plus 70 historical stiff exact linked ten-originals
        run: |
          set -euo pipefail
          python -m research.order9_last_three_incidence_v1.ten_dependents \
            --output "$RUNNER_TEMP/exact-500-mckay-ten-original-roster.json" \
            | tee "$RUNNER_TEMP/roster.log"
          grep -q '^PASS: exact 500 ten-original dependencies' "$RUNNER_TEMP/roster.log"
      - uses: actions/upload-artifact@v4
        with:
          name: original-ten-complete-500-source-dependent-roster
          path: ${{ runner.temp }}/exact-500-mckay-ten-original-roster.json
          retention-days: 90
          if-no-files-found: error

  independent-pure-python-complete-positive-replay:
    needs: discover-three-full-original-P4-projections
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier-only dependency (no pycliques or native code)
        run: python -m pip install networkx==3.6.1
      - uses: actions/download-artifact@v4
        with:
          pattern: order9-last-three-original-*-full-projection
          path: ${{ runner.temp }}/originals
          merge-multiple: true
      - name: Independently reconstruct all three P4, complete folds and every projection edge
        run: |
          set -euo pipefail
          python -m research.order9_last_three_incidence_v1.verify \
            --directory "$RUNNER_TEMP/originals" \
            --output "$RUNNER_TEMP/all-three-audited-positive-proofs.json" \
            | tee "$RUNNER_TEMP/audit.log"
          grep -q '^PASS: last three nine-original P4 ordinary octahedral' \
            "$RUNNER_TEMP/audit.log"
      - name: Fail if proof assertions can be optimized away
        run: |
          if python -O -m research.order9_last_three_incidence_v1.verify \
              --directory /tmp --output /tmp/not-allowed.json > /tmp/opt.log 2>&1; then
            echo "Unexpected optimized mathematical proof"; exit 1
          fi
          grep -q 'Cannot optimize away original P4 retraction proof' /tmp/opt.log
      - uses: actions/upload-artifact@v4
        with:
          name: order9-all-three-independent-positive-proof
          path: ${{ runner.temp }}/all-three-audited-positive-proofs.json
          retention-days: 90
          if-no-files-found: error
