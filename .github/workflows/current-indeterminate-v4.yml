name: Verify certified current order-10 unresolved list (v4)

on:
  pull_request:
    paths:
      - "scripts/**"
      - "config/**"
      - "reports/**"
      - "runs/**"
      - "postpasses/**"
      - "tests/**"
      - "indeterminate_order_9.txt"
      - "indeterminate_order_10.txt"
      - "indeterminate_order_10_v3.txt"
      - "indeterminate_order_10_v4.txt"
      - "research/order10_current_indeterminates_v4/**"
      - ".github/workflows/current-indeterminate-v4.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-300:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore frozen pre-v3 working index for historical replay
        run: cp historical/indeterminate_order_10_pre_v3.txt indeterminate_order_10.txt
      - uses: astral-sh/setup-uv@v4
      - name: Bootstrap exact historical certificate dependency revision
        run: bash scripts/bootstrap_special_k3_v5.sh
      - name: Test v4 index constraints and corruption handling
        run: |
          .venv-special-k3-v5/bin/python -m unittest discover \
            -s tests -p 'test_current_indeterminate_v4.py' -v
      - name: Independently replay all 133 special-O4 original certificates
        run: |
          .venv-special-k3-v5/bin/python \
            scripts/special_octahedron_class_lift_v1.py verify
      - name: Independently reconstruct the other 167 original certificates
        run: |
          .venv-special-k3-v5/bin/python \
            scripts/historical_ninecore_lift_v1.py \
            --output "$RUNNER_TEMP/historical-ninecore-lift-v4.json"
          .venv-special-k3-v5/bin/python \
            scripts/historical_ninecore_lift_v1.py \
            --verify "$RUNNER_TEMP/historical-ninecore-lift-v4.json"
      - name: Verify exact committed v4 original-index and proof-family sets
        run: |
          .venv-special-k3-v5/bin/python scripts/current_indeterminate_v4.py verify
      - name: Preserve every historical run and original certificate unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASE_SHA" HEAD -- \
            runs/ reports/ postpasses/ \
            indeterminate_order_9.txt \
            indeterminate_order_10_v3.txt
