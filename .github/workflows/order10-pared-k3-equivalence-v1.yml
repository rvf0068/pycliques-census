name: Exact K3-pared isomorphism classes of 1043 unresolved McKay ten-cores
on:
  push:
    branches: ["research/order10-pared-k3-equivalence-v1"]
    paths:
      - "research/order10_pared_k3_equivalence_v1/**"
      - ".github/workflows/order10-pared-k3-equivalence-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify-iterated-graph-equivalences:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install networkx==3.6.1
      - name: Build exact source-identified maps between all pared K3 graphs
        run: |
          python research/order10_pared_k3_equivalence_v1/classes.py \
            --output "$RUNNER_TEMP/pare-k3-isomorphism-classes.json"
      - name: Verify explicit isomorphism maps and every dominated fold
        run: |
          python research/order10_pared_k3_equivalence_v1/classes.py \
            --verify "$RUNNER_TEMP/pare-k3-isomorphism-classes.json"
      - uses: actions/upload-artifact@v4
        with:
          name: certified-pared-k3-classes-v10
          path: ${{ runner.temp }}/pare-k3-isomorphism-classes.json
          retention-days: 30
          if-no-files-found: error
