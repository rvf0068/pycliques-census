name: Exact K3-pared isomorphism classes of 1043 unresolved McKay ten-cores
on:
  push:
    branches: ["research/order10-pared-k3-equivalence-v1"]
    paths:
      - "research/order10_pared_k3_equivalence_v1/**"
      - ".github/workflows/order10-pared-k3-equivalence-v1.yml"
  pull_request:
    paths:
      - "research/order10_pared_k3_equivalence_v1/**"
      - ".github/workflows/order10-pared-k3-equivalence-v1.yml"
      - "indeterminate_order_10_v10.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify-parallel-shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install networkx==3.6.1
      - name: Build all independent original-McKay witnesses for shard
        run: |
          python research/order10_pared_k3_equivalence_v1/classes.py \
            --shard ${{ matrix.shard }} --shards 8 \
            --output "$RUNNER_TEMP/shard-${{ matrix.shard }}.json"
      - name: Replay and verify explicit bijections and fold witnesses
        run: |
          python research/order10_pared_k3_equivalence_v1/classes.py \
            --shard ${{ matrix.shard }} --shards 8 \
            --verify "$RUNNER_TEMP/shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pared-k3-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  audit-complete-mckay-coverage:
    needs: certify-parallel-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install networkx==3.6.1
      - uses: actions/download-artifact@v4
        with:
          pattern: pared-k3-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Independently audit exact McKay source partition and every within-shard map
        run: |
          python research/order10_pared_k3_equivalence_v1/audit.py \
            "$RUNNER_TEMP"/shards/shard-*.json \
            --output "$RUNNER_TEMP/certified-mckay-batch-audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: certified-mckay-batch-audit-v10
          path: ${{ runner.temp }}/certified-mckay-batch-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve historical proofs and the current census
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASE_SHA" HEAD -- \
            runs/ reports/ postpasses/ historical/ history/ \
            indeterminate_order_9.txt indeterminate_order_9_v1.txt indeterminate_order_9_v2.txt \
            'indeterminate_order_10*' scripts/ tests/
