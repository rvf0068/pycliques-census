name: Certify complete-ear all-iterates homotopy and snub core corollaries

on:
  pull_request:
    paths:
      - "scripts/snub_ear_all_iterates_v1.py"
      - "scripts/core9_snub_relative_k7_v1.py"
      - "scripts/core9_snub_relative_k6_v1.py"
      - "scripts/core9_snub_relative_k5_v1.py"
      - "scripts/core9_snub_handle_iterates_v1.py"
      - "research/snub_ear_all_iterates_homotopy_v1.md"
      - "research/order9_snub_handle_iterates_v1/**"
      - "tests/test_snub_ear_all_iterates_v1.py"
      - "README.md"
      - ".github/workflows/snub-ear-all-iterates-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-two-step-invariant-and-six-snub-ears:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Bootstrap independently pinned historical monorepo
        run: bash scripts/bootstrap_special_k3_v5.sh
      - name: Replay the proved K7 and all earlier relative results
        run: |
          .venv-special-k3-v5/bin/python scripts/core9_snub_relative_k7_v1.py verify
      - name: Authenticate every initial snub ear and its K2 closure
        run: |
          .venv-special-k3-v5/bin/python scripts/snub_ear_all_iterates_v1.py verify
          .venv-special-k3-v5/bin/python scripts/snub_ear_all_iterates_v1.py json
      - name: Independently exhaust structural maximal clique and fold checks
        run: |
          .venv-special-k3-v5/bin/python -m unittest discover \
            -s tests -p 'test_snub_ear_all_iterates_v1.py' -v
      - name: Protect historic census and all prior proof sources
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASE_SHA" HEAD -- \
            runs/ reports/ postpasses/ \
            research/order9_snub_retractions_v2/ \
            research/order9_snub_handle_iterates_v1/ \
            research/snub_handle_relative_k5_v1.md \
            research/snub_handle_relative_k6_v1.md \
            research/snub_handle_relative_k7_v1.md \
            scripts/core9_snub_handle_iterates_v1.py \
            scripts/core9_snub_relative_k5_v1.py \
            scripts/core9_snub_relative_k6_v1.py \
            scripts/core9_snub_relative_k7_v1.py \
            indeterminate_order_9.txt indeterminate_order_10.txt \
            indeterminate_order_10_v3.txt indeterminate_order_10_v4.txt
