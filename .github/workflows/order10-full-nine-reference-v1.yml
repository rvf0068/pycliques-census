name: Full certified nine-source references versus unresolved ten-P3 classes

on:
  pull_request:
    paths:
      - "research/order10_full_nine_reference_v1/**"
      - "research/order10_p3_global_v23_index/**"
      - "scripts/historical_divergent_targets_v1.py"
      - "scripts/graph_sources.py"
      - "scripts/validate.py"
      - "scripts/bootstrap_core9_three_target_v1.sh"
      - "scripts/core9_crossref.py"
      - "scripts/core9_clique_targets_v1.py"
      - "scripts/core9_three_target_v1.py"
      - "scripts/core9_third_retractions_v2.py"
      - "config/pycliques_commit_core9_three_target_v1.txt"
      - "historical/indeterminate_order_10_pre_v3.txt"
      - "runs/**"
      - "reports/order10_core9_crossref_v1/**"
      - "research/order10_core9_three_target_v1/**"
      - "research/order10_core9_third_retractions_v2/**"
      - "research/order10_core9_clique_targets_v1/**"
      - "indeterminate_order_9_v1.txt"
      - "indeterminate_order_9_v2.txt"
      - "indeterminate_order_9_v3.txt"
      - "indeterminate_order_9_v9.txt"
      - "indeterminate_order_10_v25.txt"
      - ".github/workflows/order10-full-nine-reference-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Check syntax, historical snapshots and exact-isomorphism regressions
        run: |
          python -m py_compile research/order10_full_nine_reference_v1/index.py
          python -m py_compile research/order10_full_nine_reference_v1/test_index.py
          python -m unittest research.order10_full_nine_reference_v1.test_index -v
      - name: Reject optimized Python execution of proof checks
        run: |
          if python -O -m research.order10_full_nine_reference_v1.index hosts --output /tmp/optimized.json >/tmp/opt.log 2>&1; then
            echo "Proof accepted optimized Python"; exit 1
          fi
          grep -q "Optimized Python is forbidden" /tmp/opt.log

  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore frozen historical roots only in the isolated runner
        run: |
          cp indeterminate_order_9_v1.txt indeterminate_order_9.txt
          cp historical/indeterminate_order_10_pre_v3.txt indeterminate_order_10.txt
      - uses: astral-sh/setup-uv@v4
      - name: Bootstrap existing authenticated historical inventory reader
        run: bash scripts/bootstrap_core9_three_target_v1.sh
      - name: Build all 10155 already-proved divergent sources and their provenance
        run: |
          .venv-core9-three-v1/bin/python -m research.order10_full_nine_reference_v1.index inventory --output "$RUNNER_TEMP/inventory.json"
          .venv-core9-three-v1/bin/python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"inventory.json").read_text())
          assert data["schema"]==1
          assert data["counts"]=={
              "initial":10096,"c10":4,"bound60":1,"bound70":3,
              "later_proved_promotions":51,"total":10155}
          assert len(data["sources"])==10155
          print("Verified",len(data["sources"]),"certified divergent sources")
          PY
      - name: Attest inventory bytes from successful source job
        id: digest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/inventory.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: full-divergent-nine-inventory-v1
          path: ${{ runner.temp }}/inventory.json
          retention-days: 30
          if-no-files-found: error

  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Independently reconstruct all surviving P3 classes
        run: |
          python -m research.order10_full_nine_reference_v1.index hosts --output "$RUNNER_TEMP/hosts.json"
      - name: Attest exact host-index bytes
        id: digest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/hosts.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: full-divergent-nine-hosts-v1
          path: ${{ runner.temp }}/hosts.json
          retention-days: 30
          if-no-files-found: error

  reference-shards:
    needs: [inventory, hosts, regression]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - uses: actions/download-artifact@v4
        with:
          name: full-divergent-nine-inventory-v1
          path: ${{ runner.temp }}/references
      - uses: actions/download-artifact@v4
        with:
          name: full-divergent-nine-hosts-v1
          path: ${{ runner.temp }}/references
      - name: Check SHA256 provenance against successful predecessor jobs
        env:
          INVENTORY_SHA256: ${{ needs.inventory.outputs.sha256 }}
          HOST_SHA256: ${{ needs.hosts.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -n "$INVENTORY_SHA256" && test -n "$HOST_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/references/inventory.json" | cut -d' ' -f1)" = "$INVENTORY_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/references/hosts.json" | cut -d' ' -f1)" = "$HOST_SHA256"
      - name: Exhaustive-for-reconstruction-limits positive-only reference shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/shards"
          python -m research.order10_full_nine_reference_v1.index shard \
            --inventory "$RUNNER_TEMP/references/inventory.json" \
            --hosts "$RUNNER_TEMP/references/hosts.json" \
            --shard "$SHARD" --shards 8 \
            --output "$RUNNER_TEMP/shards/shard-$SHARD.json"
      - uses: actions/upload-artifact@v4
        with:
          name: full-divergent-nine-shard-${{ matrix.shard }}-v1
          path: ${{ runner.temp }}/shards/shard-${{ matrix.shard }}.json
          retention-days: 30
          if-no-files-found: error

  replay:
    needs: [inventory, hosts, reference-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - uses: actions/download-artifact@v4
        with:
          name: full-divergent-nine-inventory-v1
          path: ${{ runner.temp }}/references
      - uses: actions/download-artifact@v4
        with:
          name: full-divergent-nine-hosts-v1
          path: ${{ runner.temp }}/references
      - uses: actions/download-artifact@v4
        with:
          pattern: full-divergent-nine-shard-*-v1
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Authenticate all original upstream index bytes
        env:
          INVENTORY_SHA256: ${{ needs.inventory.outputs.sha256 }}
          HOST_SHA256: ${{ needs.hosts.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/references/inventory.json" | cut -d' ' -f1)" = "$INVENTORY_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/references/hosts.json" | cut -d' ' -f1)" = "$HOST_SHA256"
          test "$(find "$RUNNER_TEMP/shards" -name 'shard-*.json' | wc -l)" -eq 8
      - name: Reconstruct and independently replay every proposed full positive bijection
        run: |
          python -m research.order10_full_nine_reference_v1.index aggregate \
            --inventory "$RUNNER_TEMP/references/inventory.json" \
            --hosts "$RUNNER_TEMP/references/hosts.json" \
            --results "$RUNNER_TEMP/shards" --shards 8 \
            --output "$RUNNER_TEMP/verified-positives.json"
      - name: Summarize certified matches and explicit resource limitations
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads((Path(os.environ["RUNNER_TEMP"])/"verified-positives.json").read_text())
          print(json.dumps({key:obj[key] for key in (
              "historical_proved_reference_count","ten_p3_class_count",
              "source_p0_classes_within_shards","reconstruction_resource_limits",
              "comparison_time_limits","proven_ten_original_indices"
          )},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-divergent-nine-verified-positives-v1
          path: ${{ runner.temp }}/verified-positives.json
          retention-days: 30
          if-no-files-found: error
