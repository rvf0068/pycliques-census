name: Exact HCZTf early-iterate divergent-target screens

on:
  pull_request:
    paths:
      - "scripts/hcztf_retraction_screen_v1.py"
      - "tests/test_hcztf_retraction_screen_v1.py"
      - "research/order9_hcztf_retraction_screen_v1/**"
      - ".github/workflows/hcztf-retraction-screen-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-140-induced-copies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "networkx==3.6.1"
      - name: Reconstruct every induced target and independently check local obstructions
        run: |
          python scripts/hcztf_retraction_screen_v1.py run > /tmp/hcztf-screen.json
          python scripts/hcztf_retraction_screen_v1.py verify --file /tmp/hcztf-screen.json
          python -m unittest discover -s tests -p test_hcztf_retraction_screen_v1.py -v
      - name: Keep all historical census data and current classification unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git hash-object indeterminate_order_9_v1.txt)" = "4f210949dad5e7350fc0185c34738e2bf46f9012"
          git diff --exit-code "$BASE_SHA" HEAD -- runs/ reports/ postpasses/ \
            indeterminate_order_10_v3.txt indeterminate_order_10.txt \
            indeterminate_order_10_v3.txt indeterminate_order_10_v4.txt \
            indeterminate_order_10_v5.txt indeterminate_order_10_v6.txt \
            indeterminate_order_10_v7.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hcztf-early-retraction-negative-certificate
          path: /tmp/hcztf-screen.json
          if-no-files-found: error
