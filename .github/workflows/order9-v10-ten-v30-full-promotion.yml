name: Certify zero-nine-v10 and 537-ten-v30 from complete positive proofs

on:
  pull_request:
    paths:
      - "research/order9_v10_order10_v30/**"
      - "research/order9_last_three_incidence_v1/**"
      - "research/order10_v29_six_coaffine_joins/**"
      - "indeterminate_order_9.txt"
      - "indeterminate_order_9_v9.txt"
      - "indeterminate_order_9_v10.txt"
      - "indeterminate_order_10.txt"
      - "indeterminate_order_10_v29.txt"
      - "indeterminate_order_10_v30.txt"
      - "tests/test_current_root_index.py"
      - ".github/workflows/order9-v10-ten-v30-full-promotion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-original-P4-positive-proofs-and-exact-500-ten-promotions:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Independently replay all three permanent P4 retractions from original graph6
        run: |
          set -euo pipefail
          python -m research.order9_last_three_incidence_v1.verify_permanent \
            > "$RUNNER_TEMP/nine-positive.log"
          grep -q '^PASS: all three permanent original nine-P4' "$RUNNER_TEMP/nine-positive.log"
          grep -q '"all_original_P4_edges_checked": 1325328' "$RUNNER_TEMP/nine-positive.log"
      - name: Independently reconstruct all 500 McKay ten-original dependency IDs
        run: |
          python -m research.order9_last_three_incidence_v1.ten_dependents \
            --output "$RUNNER_TEMP/ten-originals-500.json" | tee "$RUNNER_TEMP/roster.log"
          grep -q '^PASS: exact 500 ten-original dependencies' "$RUNNER_TEMP/roster.log"
      - name: Audit exact zero-nine and 537-ten original snapshots
        run: |
          set -euo pipefail
          python -m research.order9_v10_order10_v30.verify \
            | tee "$RUNNER_TEMP/final-promotion.log"
          grep -q '^PASS: exact zero-indeterminate nine-v10 and 537-indeterminate ten-v30' \
            "$RUNNER_TEMP/final-promotion.log"
          grep -q '"ten_after": 537' "$RUNNER_TEMP/final-promotion.log"
          grep -q '"nine_after": 0' "$RUNNER_TEMP/final-promotion.log"
          grep -q '"previous_six_ten_positive_proofs_replayed": true' \
            "$RUNNER_TEMP/final-promotion.log"
      - uses: actions/upload-artifact@v4
        with:
          name: all-nine-and-500-ten-full-positive-archive
          path: |
            ${{ runner.temp }}/ten-originals-500.json
            ${{ runner.temp }}/final-promotion.log
          retention-days: 90
          if-no-files-found: error

  immutable-index-roots-and-adversarial-promotion-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Authenticate all four immutable Git blobs and current roots
        run: |
          set -euo pipefail
          cmp indeterminate_order_9.txt indeterminate_order_9_v10.txt
          cmp indeterminate_order_10.txt indeterminate_order_10_v30.txt
          test "$(git hash-object indeterminate_order_9_v9.txt)" = d18a7a843be935f3a7fe911691dd1c86dac2addd
          test "$(git hash-object indeterminate_order_9_v10.txt)" = b2c3773a1206472868708745d92bbb9b22f7fab6
          test "$(git hash-object indeterminate_order_10_v29.txt)" = f26d392746391f40aa224d4e639627b4617caff1
          test "$(git hash-object indeterminate_order_10_v30.txt)" = d5d70d113e78b90588041ebaf60a14b26e0d2bda
      - name: Test strict 3+500 exact removals and adversarial source mutations
        run: |
          python -m compileall -q research/order9_v10_order10_v30
          python -m unittest research.order9_v10_order10_v30.test_verify -v
      - name: Test historical stage comparisons and new active current roots
        run: python -m unittest discover -s tests -p test_current_root_index.py -v
      - name: Do not optimize away mathematical proof checks
        run: |
          set -euo pipefail
          if python -O -m research.order9_v10_order10_v30.verify > "$RUNNER_TEMP/optimized.log" 2>&1; then
            echo "Optimized final positive proof unexpectedly accepted"; exit 1
          fi
          grep -q 'Cannot optimize away final nine-v10 ten-v30 positive proof' "$RUNNER_TEMP/optimized.log"
