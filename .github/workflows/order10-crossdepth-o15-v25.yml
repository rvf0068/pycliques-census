name: Certify four ten-v25 cross-depth P4-to-nine-P3 O15 divergences

on:
  pull_request:
    paths:
      - "indeterminate_order_10.txt"
      - "indeterminate_order_10_v24.txt"
      - "indeterminate_order_10_v25.txt"
      - "indeterminate_order_10_v26.txt"
      - "indeterminate_order_10_v27.txt"
      - "indeterminate_order_10_v28.txt"
      - "research/order10_v26_six_p3_octahedral/**"
      - "indeterminate_order_9_v4.txt"
      - "indeterminate_order_9_v9.txt"
      - "indeterminate_order_9.txt"
      - "research/order10_p4_crossdepth_o15_v25/**"
      - "research/order9_260910_o15_v1/**"
      - "research/order10_p3_global_v23_index/**"
      - "research/order10_p4_cap_rescue_v24/**"
      - "tests/test_current_root_index.py"
      - ".github/workflows/order10-crossdepth-o15-v25.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-positive-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent graph dependency
        run: python -m pip install networkx==3.6.1
      - name: Compile exact cross-depth and frozen O15 proof verifiers
        run: |
          python -m py_compile research/order10_p4_crossdepth_o15_v25/verify.py
          python -m py_compile research/order10_p4_crossdepth_o15_v25/replay_v24.py
      - name: Independently replay historical ten-v25 proofs and tests with frozen snapshot alias
        run: python -m research.order10_v26_six_p3_octahedral.replay_v25
      - name: Independently audit the current certified ten-v28 root
        run: python -m unittest discover -s tests -p test_current_root_index.py -v
      - name: Reject optimized proof replay
        run: |
          if python -O -m research.order10_p4_crossdepth_o15_v25.verify > /tmp/v25-opt.log 2>&1; then
            echo "Optimized Python erroneously accepted proof"; exit 1
          fi
          grep -q "Optimized Python bypasses positive proof assertions" /tmp/v25-opt.log

  historical-nine-o15-public:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install historical pinned pycliques and NetworkX
        run: |
          python -m pip install networkx==3.6.1
          git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project
          git -C /tmp/pycliques-project checkout --quiet 7ae36ffe67fb2e9bbafc68e97347aabcf757c2dc
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Replay original independent and public pycliques O15 certificate
        run: python -m research.order9_260910_o15_v1.verify

  historical-ten-v24-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Independently replay ten-v24 positive O12 source and witnesses under frozen v24 alias
        run: python -m research.order10_p4_crossdepth_o15_v25.replay_v24 v24_lifts
