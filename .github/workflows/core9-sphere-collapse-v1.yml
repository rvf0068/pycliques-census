name: Two nine-core exact sphere-collapse certificates

on:
  pull_request:
    paths:
      - "scripts/core9_sphere_collapse_v1.py"
      - "scripts/core9_third_homology_v1.py"
      - "tests/test_core9_sphere_collapse_v1.py"
      - "tests/test_core9_third_homology_v1.py"
      - "research/order9_two_sphere_collapses_v1/**"
      - ".github/workflows/core9-sphere-collapse-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-elementary-collapses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "networkx==3.6.1"
      - name: Independently replay every collapse and check all sphere links
        run: |
          python scripts/core9_sphere_collapse_v1.py build --output /tmp/two-nine-spheres.json
          python scripts/core9_sphere_collapse_v1.py verify --output /tmp/two-nine-spheres.json
          python -m unittest discover -s tests -p 'test_core9_sphere_collapse_v1.py' -v
      - name: Recompute exact third-iterate GF(2) Betti and boundary ranks
        run: |
          python scripts/core9_third_homology_v1.py
          python -m unittest discover -s tests -p 'test_core9_third_homology_v1.py' -v
      - name: Ensure all historical census results and versioned proof files unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code "$BASE_SHA" HEAD --             runs/ reports/ postpasses/ indeterminate_order_9.txt             indeterminate_order_10.txt indeterminate_order_10_v3.txt             indeterminate_order_10_v4.txt indeterminate_order_10_v5.txt             indeterminate_order_10_v6.txt
