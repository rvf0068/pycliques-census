name: Certify P3 eight-vertex low-degree retraction obstruction for three nine-v9 cores

on:
  pull_request:
    paths:
      - "indeterminate_order_9_v9.txt"
      - "research/order9_p3_eight_vertex_obstruction_v1/**"
      - ".github/workflows/order9-p3-eight-vertex-obstruction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-integer-and-f2-proof:
    name: Complete Python integer DPLL and GF2 homology from original graph6
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Rebuild all P3 hosts, exhaust size-eight external double covers, verify homology
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile research/order9_p3_eight_vertex_obstruction_v1/verify.py research/order9_p3_eight_vertex_obstruction_v1/replay_cpp.py
          python -m research.order9_p3_eight_vertex_obstruction_v1.verify
      - name: Ensure optimized Python cannot bypass proof assertions
        run: |
          out=$(mktemp)
          err=$(mktemp)
          trap 'rm -f "$out" "$err"' EXIT
          if python -O -m research.order9_p3_eight_vertex_obstruction_v1.verify >"$out" 2>"$err"; then
            echo "ERROR: optimized verifier unexpectedly returned success"
            exit 1
          else
            status=$?
          fi
          if [ "$status" -ne 1 ] || ! grep -Fxq 'RuntimeError: Optimized Python bypasses proof-critical assertions' "$err"; then
            echo "ERROR: optimized verification failed for an unexpected reason ($status)"
            cat "$out"
            cat "$err" >&2
            exit 1
          fi


  nine-vertex-exact-obstruction:
    name: Exhaust 30,297,343 size-nine double covers and verify all 231 low-degree unary contradictions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Exact-size-nine DPLL, independent small-graph brute-force tests, and fixed-target unary proof
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile research/order9_p3_eight_vertex_obstruction_v1/verify_nine.py
          python -m research.order9_p3_eight_vertex_obstruction_v1.verify_nine


  independently-compiled-integer-proof:
    name: C++17 exact eight-cover counts 0,1,1 independently replayed
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - run: c++ --version
      - name: Compile and independently reproduce three exhaustive negative/unique results
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order9_p3_eight_vertex_obstruction_v1.replay_cpp

  public-pycliques-stages:
    name: Cross-check all three P0-P3 graph stages against pinned public pycliques
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: 4110b59cc89bc303628f705250d025a308a8c69d
          path: pycliques-dependency
          persist-credentials: false
      - run: |
          python -m pip install networkx==3.6.1
          python -m pip install ./pycliques-dependency/packages/pycliques
      - name: Replay P3 clique graphs, parings, DPLL and homology independently
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order9_p3_eight_vertex_obstruction_v1.verify --public
