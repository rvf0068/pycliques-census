name: Certified coaffine join targets of third pared clique iterates

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "runs/**"
      - "reports/**"
      - "research/order10_core9_coaffine_join_targets_v1/**"
      - "research/order10_core9_clique_targets_v1/**"
      - "research/order10_core9_third_retractions_v2/**"
      - ".github/workflows/core9-coaffine-join-targets-v1.yml"
      - "README.md"
  workflow_dispatch:

jobs:
  certified-coaffine-join-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore frozen pre-v3 working index for historical replay
        run: cp historical/indeterminate_order_10_pre_v3.txt indeterminate_order_10.txt
      - uses: astral-sh/setup-uv@v4
      - name: Bootstrap separately pinned optimized library
        run: bash scripts/bootstrap_core9_three_target_v1.sh
      - name: Install isolated test runner
        run: uv pip install --python .venv-core9-three-v1/bin/python pytest
      - name: Mathematical and reproducibility unit tests
        run: |
          .venv-core9-three-v1/bin/python -m pytest \
            tests/core9_coaffine_join_targets_v1_cases.py -v
      - name: Enumerate every homology-matched induced target and check retractions
        run: |
          .venv-core9-three-v1/bin/python \
            scripts/core9_coaffine_join_targets_v1.py run \
            --output "$RUNNER_TEMP/core9-coaffine-join-targets-v1"
          .venv-core9-three-v1/bin/python \
            scripts/core9_coaffine_join_targets_v1.py report \
            --output "$RUNNER_TEMP/core9-coaffine-join-targets-v1"
      - name: Authenticate all 10 named target families
        run: |
          .venv-core9-three-v1/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ["RUNNER_TEMP"]) / "core9-coaffine-join-targets-v1"
          names = sorted(p.name for p in (base / "records").glob("*.json"))
          assert names == ["06914104.json", "06962151.json"], names
          rows = [json.loads((base / "records" / name).read_text()) for name in names]
          assert all(row["status"] in ("COMPLETED","TIMEOUT") for row in rows)
          assert sum(row.get("represented_ten_vertex_graphs", 0) for row in rows
                     if row["status"] == "COMPLETED") in (0,219,242,461)
          for row in rows:
              if row["status"] != "COMPLETED":
                  continue
              print(json.dumps({
                  "core_id":row["core_id"],
                  "probes":[{
                      "n":p["n"],"r":p["r"],
                      "induced":p["induced_target_count"],
                      "local_impossible":p["local_impossible"],
                      "csp_exhausted":p["csp_exhausted"],
                      "csp_states":p["csp_states_total"],
                      "found":p["found_count"],
                  } for p in row["probes"]],
                  "positive":len(row["positive_witnesses"]),
              },sort_keys=True))
          PY
      - name: Cross-check the permanent ten-case index and SHA256 fingerprints
        run: |
          .venv-core9-three-v1/bin/python - <<'PY'
          import csv, hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "core9-coaffine-join-targets-v1"
          report = Path("research/order10_core9_coaffine_join_targets_v1")
          with (report / "target_counts.tsv").open(encoding="utf-8", newline="") as f:
              index = list(csv.DictReader(f, delimiter="\t"))
          observations = {}
          for core_id in (6914104,6962151):
              row = json.loads((root/"records"/f"{core_id:08d}.json").read_text())
              if row["status"] != "COMPLETED":
                  raise AssertionError("Cannot authenticate a timed-out case with negative counts")
              for group in row["probes"]:
                  observations[(core_id,group["n"],group["r"])] = group
          assert len(index) == len(observations) == 10
          for line in index:
              key = (int(line["core_id"]),int(line["n"]),int(line["r"]))
              proof = observations[key]
              for stored,calculated in (
                  ("chordless_cycles","cycle_count"),
                  ("induced_targets","induced_target_count"),
                  ("locally_impossible","local_impossible"),
                  ("csp_exhausted","csp_exhausted"),
                  ("independent_states","csp_states_total"),
                  ("pinned_states","pinned_states_total"),
                  ("positive","found_count"),
              ):
                  assert int(line[stored]) == proof[calculated], (key, stored)
              assert line["target_sets_sha256"] == proof["target_sets_sha256"]
          checksums = (report / "artifact_checksums.md").read_text()
          for name in ("manifest.json", "records/06914104.json", "records/06962151.json"):
              actual = hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert f"`{name}` | `{actual}`" in checksums, name
          print("All 10 permanent proof-index rows and all three complete JSON SHA256 values match")
          PY
      - name: Upload full independent proof records (read-only)
        uses: actions/upload-artifact@v4
        with:
          name: core9-coaffine-join-targets-v1
          path: ${{ runner.temp }}/core9-coaffine-join-targets-v1/
          retention-days: 30
          if-no-files-found: error
      - name: Reject modifications to frozen census data and old certificates
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASE_SHA" HEAD -- \
            runs/ reports/ postpasses/ \
            indeterminate_order_9.txt \
            research/order10_core9_three_target_v1/ \
            research/order10_core9_third_retractions_v2/ \
            research/order10_core9_clique_targets_v1/ \
            scripts/core9_three_target_v1.py \
            scripts/core9_third_retractions_v2.py \
            scripts/core9_clique_targets_v1.py
