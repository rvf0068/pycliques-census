name: Audit archived nine-vertex non-octahedral retraction searches

on:
  # No paths filter: a protected-file-only change must still execute the guard.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-retraction-record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install reproducible graph dependency
        run: python -m pip install networkx==3.6.1
      - name: Audit cohort, proved exclusions, timeout semantics and O8 witnesses
        run: python research/order9_non_octahedral_clique_targets_v1/verify_record.py --self-test
      - name: Protect all historical census and existing proof records
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Protect all previous census snapshots, proof sources and stages.
          # v10/current may advance ONLY via independently replayed positives
          # and the dedicated v10 audit; neither is a historical source.
          git diff --exit-code "$BASE_SHA" HEAD -- \
            'indeterminate_order_9*' 'indeterminate_order_10_v[1-9].txt' \
            homotopy_order_10.tsv historical/ history/ runs/ reports/ \
            config/ postpasses/
          # Keep old scripts and tests immutable; only the regression test
          # that checks the authoritative root may track a new version.
          git diff --exit-code "$BASE_SHA" HEAD -- \
            scripts/ tests/ ':(exclude)tests/test_current_root_index.py'
          # Archive preservation: modifications/deletions/renames of existing
          # research files are forbidden, but brand-new versioned research
          # records are append-only additions and therefore allowed.
          git diff --exit-code --diff-filter=DMRTUXB "$BASE_SHA" HEAD -- research/
