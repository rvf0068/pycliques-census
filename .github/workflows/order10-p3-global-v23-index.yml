name: Global exact P3 classes of current ten-v23 stiff cores

on:
  pull_request:
    paths:
      - "indeterminate_order_10_v23.txt"
      - "indeterminate_order_10_v24.txt"
      - "research/order10_p4_o12_lifts_v24/replay_v23.py"
      - "indeterminate_order_10.txt"
      - "indeterminate_order_9_v10.txt"
      - "research/order10_p3_global_v23_index/**"
      - ".github/workflows/order10-p3-global-v23-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-third-iterate-index:
    name: Reconstruct exact P3 classes and all saved isomorphism bijections
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Replay frozen v23 global index and independent P3 verifier
        run: |
          test -s research/order10_p3_global_v23_index/certificates.json
          cp indeterminate_order_9_v9.txt indeterminate_order_9.txt
          python -m research.order10_p4_o12_lifts_v24.replay_v23 p3
      - name: Reject optimized execution bypassing proof assertions
        run: |
          if python -O -m research.order10_p3_global_v23_index.classes build > /tmp/p3-opt.txt 2>&1; then
            echo "ERROR: proof critical checks bypassed by -O"
            exit 1
          fi
          grep -Fq 'RuntimeError: Optimized Python bypasses proof-critical checks' /tmp/p3-opt.txt
