name: Global exact P3 classes of current ten-v23 stiff cores

on:
  pull_request:
    paths:
      - "indeterminate_order_10_v23.txt"
      - "indeterminate_order_10.txt"
      - "research/order10_p3_global_v23_index/**"
      - ".github/workflows/order10-p3-global-v23-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-third-iterate-index:
    name: Reconstruct exact P3 classes and all saved isomorphism bijections
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Independently build full global index
        run: |
          python -m py_compile research/order10_p3_global_v23_index/classes.py
          python -m research.order10_p3_global_v23_index.classes build --output /tmp/order10-p3-global-index.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          data = Path("/tmp/order10-p3-global-index.json").read_bytes()
          counts = json.loads(data)["counts"]
          print("RESULT_COUNTS", json.dumps(counts, sort_keys=True))
          print("CERTIFICATE_BEGIN")
          encoded = base64.b64encode(data).decode("ascii")
          for pos in range(0, len(encoded), 180):
              print("P3_INDEX_CHUNK:" + encoded[pos:pos + 180])
          print("CERTIFICATE_END")
          PY
      - name: Verify immutable positive class witnesses
        run: |
          if test -f research/order10_p3_global_v23_index/certificates.json; then
            python -m research.order10_p3_global_v23_index.classes verify
            python -m unittest research.order10_p3_global_v23_index.test_classes -v
          fi
      - name: Reject optimized execution bypassing proof assertions
        run: |
          if python -O -m research.order10_p3_global_v23_index.classes build > /tmp/p3-opt.txt 2>&1; then
            echo "ERROR: proof critical checks bypassed by -O"
            exit 1
          fi
          grep -Fq 'RuntimeError: Optimized Python bypasses proof-critical checks' /tmp/p3-opt.txt
