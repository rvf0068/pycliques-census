name: Cached targeted retraction postpass

on:
  pull_request:
    paths:
      - "scripts/targeted_retractions_v1.py"
      - "scripts/bootstrap_targeted_v1.sh"
      - "config/pycliques_commit_targeted_v1.txt"
      - "tests/targeted_retractions_v1_cases.py"
      - ".github/workflows/targeted-retractions-v1.yml"
      - "README.md"
      - "indeterminate_order_9.txt"
      - "indeterminate_order_10.txt"
  workflow_dispatch:

jobs:
  small-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore frozen pre-v3 working index for historical replay
        run: cp historical/indeterminate_order_10_pre_v3.txt indeterminate_order_10.txt
      - uses: astral-sh/setup-uv@v4
      - name: Bootstrap isolated pinned monorepo
        run: bash scripts/bootstrap_targeted_v1.sh
      - name: Install test-only pytest
        run: uv pip install --python .venv-targeted-v1/bin/python pytest
      - name: Validate cache/retraction tests
        run: .venv-targeted-v1/bin/python -m pytest tests/targeted_retractions_v1_cases.py -v
      - name: Initial unresolved nine-vertex pilot
        run: |
          .venv-targeted-v1/bin/python scripts/targeted_retractions_v1.py plan --order 9
          .venv-targeted-v1/bin/python scripts/targeted_retractions_v1.py next --order 9 --batch-size 2
          .venv-targeted-v1/bin/python scripts/targeted_retractions_v1.py verify --order 9
          .venv-targeted-v1/bin/python scripts/targeted_retractions_v1.py plan --order 10
      - name: Protect all historical census data and preexisting pins
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASE_SHA" HEAD -- \
            runs/ reports/ \
            ':(exclude)reports/order10_special_octahedron_core_lift_v1/**' postpasses/ \
            config/pycliques_commit_core9cover_v2.txt \
            indeterminate_order_9.txt
