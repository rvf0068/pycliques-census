name: Certify promoted nine-vertex v5 and ten-vertex v16 indices

on:
  pull_request:
    paths:
      - "indeterminate_order_9.txt"
      - "indeterminate_order_9_v4.txt"
      - "indeterminate_order_9_v5.txt"
      - "indeterminate_order_10.txt"
      - "indeterminate_order_10_v14.txt"
      - "indeterminate_order_10_v15.txt"
      - "indeterminate_order_10_v16.txt"
      - "research/order10_current_indeterminates_v16/**"
      - "research/order10_current_indeterminates_v17/replay_v16.py"
      - "indeterminate_order_9_v6.txt"
      - "indeterminate_order_10_v17.txt"
      - "research/order9_f45_o9_v1/**"
      - "research/order9_260910_o15_v1/**"
      - "tests/test_current_root_index.py"
      - ".github/workflows/order10-current-v16.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index-and-surfaces:
    name: Exact 2 + 120 + 80 promotion audit and nine flag spheres
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent NetworkX
        run: python -m pip install networkx==3.6.1
      - name: Check Python syntax, exact deleted originals, unchanged records, and surface links
        run: |
          python -m py_compile \
            research/order10_current_indeterminates_v16/verify.py \
            research/order10_current_indeterminates_v16/replay_v15.py \
            research/order10_current_indeterminates_v16/replay_v14.py
          python -m research.order10_current_indeterminates_v17.replay_v16 --surfaces
          python -m unittest discover -s tests -p test_current_root_index.py -v

  f45-120:
    name: Independently replay all 120 F45 dependent positives
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned public pycliques
        run: |
          python -m pip install networkx==3.6.1
          for attempt in 1 2 3; do
            if git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project; then
              break
            fi
            test "$attempt" -lt 3
            rm -rf /tmp/pycliques-project
            sleep "$((5 * attempt))"
          done
          git -C /tmp/pycliques-project checkout --quiet 782deb653b8748e1b5759389cdd2134beac69351
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Replay O9 retraction and every F45 dependency witness
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order10_current_indeterminates_v17.replay_v16 --f45

  o15-80:
    name: Independently replay all 80 O15 proofs and full v14 screen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned public pycliques
        run: |
          python -m pip install networkx==3.6.1
          for attempt in 1 2 3; do
            if git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project; then
              break
            fi
            test "$attempt" -lt 3
            rm -rf /tmp/pycliques-project
            sleep "$((5 * attempt))"
          done
          git -C /tmp/pycliques-project checkout --quiet 782deb653b8748e1b5759389cdd2134beac69351
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Replay O15 retraction, all 80 positive witnesses, and exhaustive original v14 screen
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order10_current_indeterminates_v17.replay_v16 --o15-full

  historical-replays:
    name: Replay frozen v4/v14 and v15 proofs under new roots
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned public pycliques
        run: |
          python -m pip install networkx==3.6.1
          for attempt in 1 2 3; do
            if git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project; then
              break
            fi
            test "$attempt" -lt 3
            rm -rf /tmp/pycliques-project
            sleep "$((5 * attempt))"
          done
          git -C /tmp/pycliques-project checkout --quiet 782deb653b8748e1b5759389cdd2134beac69351
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Replay immutable v15/v14 and v16 proofs against frozen input snapshots
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m research.order10_current_indeterminates_v16.replay_v15 --public
          python -m research.order10_current_indeterminates_v16.replay_v14
          python -m research.order10_current_indeterminates_v17.replay_v16
