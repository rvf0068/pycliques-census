# One-time reproducible artifact generator; removes itself on success.
name: Generate new certified stiff-ten divergent nine-core retractions

on:
  pull_request:
    paths:
      - ".github/workflows/direct-divergent-ninecore-generate-once.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/direct-divergent-ninecore-retracts-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@v4
      - name: Configure exact isolated NetworkX version
        run: |
          uv venv .venv-direct
          uv pip install --python .venv-direct/bin/python networkx==3.6.1
      - name: Independently reconstruct six-target exhaustive source audit
        run: |
          .venv-direct/bin/python scripts/direct_divergent_ninecore_retracts_v1.py build
          .venv-direct/bin/python -m unittest discover \
            -s tests -p 'test_direct_divergent_ninecore_retracts_v1.py' -v
          .venv-direct/bin/python scripts/direct_divergent_ninecore_retracts_v1.py verify
      - name: Freeze new proofs, retain all historic source bytes, remove temporary generator
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indeterminate_order_10_v5.txt research/order10_direct_divergent_ninecore_retracts_v1/
          git rm .github/workflows/direct-divergent-ninecore-generate-once.yml
          git commit -m 'Commit nine exact divergent retractions and certified 8224-case v5 index'
          git push origin HEAD:research/direct-divergent-ninecore-retracts-v1
