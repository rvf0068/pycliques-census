name: Certify McKay 251902 P4 to O17 and 150 exact ten-original lifts

on:
  pull_request:
    paths:
      - "indeterminate_order_9_v7.txt"
      - "indeterminate_order_10_v18.txt"
      - "research/order9_p4_domination_dual_v1/**"
      - "research/order9_251902_p4_o17_v1/**"
      - ".github/workflows/order9-251902-p4-o17.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-complete-positive:
    name: Independent P4 reconstruction, all 461 projection images and 150 ten-core lifts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Rebuild from graph6 and certify all images and McKay isomorphism lifts
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile research/order9_251902_p4_o17_v1/verify.py research/order9_251902_p4_o17_v1/discover.py
          python -m research.order9_251902_p4_o17_v1.verify
      - name: Reject unrelated optimized-verifier failure
        run: |
          stdout_file=$(mktemp)
          stderr_file=$(mktemp)
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT
          if python -O -m research.order9_251902_p4_o17_v1.verify >"$stdout_file" 2>"$stderr_file"; then
            echo "ERROR: optimized proof verification unexpectedly passed"
            exit 1
          else
            status=$?
          fi
          if [ "$status" -ne 1 ] || ! grep -Fxq 'RuntimeError: Optimized Python bypasses proof-critical assertions' "$stderr_file"; then
            echo "ERROR: unexpected verifier failure ($status)"
            cat "$stdout_file"
            cat "$stderr_file" >&2
            exit 1
          fi

  pinned-public-positive-replay:
    name: Public pycliques stage-by-stage clique and full retraction witness check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: d140bd3a666ca6abf77e5823740ecef85e75a842
          path: pycliques-dependency
          persist-credentials: false
      - run: |
          python -m pip install networkx==3.6.1
          python -m pip install ./pycliques-dependency/packages/pycliques
      - name: Replay independently using public pycliques
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order9_251902_p4_o17_v1.verify --public

  pinned-unseeded-native-discovery:
    name: Rediscover O17 without a saved target using PR36 native coaffine solver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: d140bd3a666ca6abf77e5823740ecef85e75a842
          path: pycliques-dependency
          persist-credentials: false
      - run: |
          python -m pip install networkx==3.6.1
          python -m pip install ./pycliques-dependency/packages/pycliques
          c++ --version
      - name: Independently discover and validate 461-vertex projection
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order9_251902_p4_o17_v1.discover
