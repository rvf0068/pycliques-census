# Temporary deterministic artifact generator restricted to this PR branch.
# On success commits the exact certificates and removes itself.
name: Generate first-clique O3 divergence certificate once

on:
  pull_request:
    paths:
      - ".github/workflows/first-clique-octahedron-generate-once.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/first-clique-octahedron-retract-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@v4
      - name: Configure independently pinned NetworkX
        run: |
          uv venv .venv-octa
          uv pip install --python .venv-octa/bin/python networkx==3.6.1
      - name: Generate and independently replay exact first-clique octahedral certificates
        run: |
          .venv-octa/bin/python scripts/first_clique_octahedron_retract_v1.py build
          .venv-octa/bin/python -m unittest discover \
            -s tests -p 'test_first_clique_octahedron_retract_v1.py' -v
          .venv-octa/bin/python scripts/first_clique_octahedron_retract_v1.py verify
      - name: Commit the new versioned artifacts and remove the generator
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indeterminate_order_10_v6.txt research/order10_first_clique_octahedron_retract_v1/
          git rm .github/workflows/first-clique-octahedron-generate-once.yml
          git commit -m 'Commit verified O3 first-clique divergence and exact 8223-case current list'
          git push origin HEAD:research/first-clique-octahedron-retract-v1
