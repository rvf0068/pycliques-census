name: Certify expansive first pared clique graphs of all 613 ten-v28 stiff originals

on:
  pull_request:
    paths:
      - "research/order10_v28_p1_coaffine_join_v1/**"
      - "research/order10_p3_global_v23_index/**"
      - "indeterminate_order_10_v28.txt"
      - ".github/workflows/order10-v28-P1-coaffine-joins.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-full-613-P1-positive-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - name: Enumerate every stiff-ten P1 using two independently checked clique enumerators
        run: |
          python -m research.order10_v28_p1_coaffine_join_v1.search \
            --output "$RUNNER_TEMP/p1-positive-joins.json" \
            | tee "$RUNNER_TEMP/discovery.log"
          grep -q '^PASS: all 613 stiff ten-v28 first iterates checked' "$RUNNER_TEMP/discovery.log"
          grep -q '^POSITIVE P1 original=11715667' "$RUNNER_TEMP/discovery.log"
          grep -q '^POSITIVE P1 original=11716441' "$RUNNER_TEMP/discovery.log"
      - name: Independently authenticate every original graph6 and complete P1 theorem
        run: |
          python -m research.order10_v28_p1_coaffine_join_v1.verify \
            --archive "$RUNNER_TEMP/p1-positive-joins.json" \
            --output "$RUNNER_TEMP/p1-independently-certified.json" \
            | tee "$RUNNER_TEMP/verification.log"
          grep -q '^PASS: exact all-stiff-ten P1 expansive joins' "$RUNNER_TEMP/verification.log"
      - name: Replay permanent exact two-original P1-to-expansive-join certificates
        run: |
          python -m research.order10_v28_p1_coaffine_join_v1.verify_permanent | tee "$RUNNER_TEMP/permanent.log"
          grep -q '^PASS: two complete P1-to-expansive-O2-join' "$RUNNER_TEMP/permanent.log"
      - name: Positive and adversarial theorem tests
        run: |
          python -m compileall -q research/order10_v28_p1_coaffine_join_v1
          python -m unittest research.order10_v28_p1_coaffine_join_v1.test_verify -v
      - name: Reject optimized proof assertion bypass
        run: |
          set -euo pipefail
          if python -O -m research.order10_v28_p1_coaffine_join_v1.verify \
             --archive /tmp/nonexistent --output /tmp/nonexistent.json \
             > "$RUNNER_TEMP/opt.log" 2>&1; then
            echo "Optimized first-iterate proof unexpectedly succeeded"; exit 1
          fi
          grep -q 'Cannot optimize away exact first-iterate positive replay' "$RUNNER_TEMP/opt.log"
      - uses: actions/upload-artifact@v4
        with:
          name: ten-v28-613-P1-complete-positive-join-certificates
          path: |
            ${{ runner.temp }}/p1-positive-joins.json
            ${{ runner.temp }}/p1-independently-certified.json
          retention-days: 90
          if-no-files-found: error
