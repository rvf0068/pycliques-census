name: McKay 260910 exact K3 connectivity and target obstructions

on:
  # No path filter: a protected-only edit must execute the history guard.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order9-260910-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned NetworkX
        run: python -m pip install networkx==3.6.1
      - name: Independently replay finite topology certificates and adversarial checks
        run: python research/order9_260910_connectivity_v1/verify.py --self-test
      - name: Protect existing census, proofs, and prior research archives
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Protect all previous census snapshots, proof sources and stages.
          # v9/current may advance ONLY via independently replayed positives
          # and the dedicated v9 audit; neither is a historical source.
          git diff --exit-code "$BASE_SHA" HEAD -- \
            'indeterminate_order_9*' 'indeterminate_order_10_v[1-8].txt' \
            homotopy_order_10.tsv historical/ history/ runs/ reports/ \
            config/ postpasses/
          # Keep old scripts and tests immutable; only the regression test
          # that checks the authoritative root may track a new version.
          git diff --exit-code "$BASE_SHA" HEAD -- \
            scripts/ tests/ ':(exclude)tests/test_current_root_index.py'
          # Archive preservation: modifications/deletions/renames of existing
          # research files are forbidden, but brand-new versioned research
          # records are append-only additions and therefore allowed.
          git diff --exit-code --diff-filter=DMRTUXB "$BASE_SHA" HEAD -- research/
