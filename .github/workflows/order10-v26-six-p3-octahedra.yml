name: Certify six original ten-v26 divergences via five P3 octahedral retractions

on:
  pull_request:
    paths:
      - "research/order10_v26_six_p3_octahedral/**"
      - "research/order10_overcap_p3_coaffine_v1/**"
      - "research/order10_p3_global_v23_index/**"
      - "research/order10_full_nine_reference_v1/**"
      - "research/order10_p4_crossdepth_o15_v25/**"
      - "indeterminate_order_10_v25.txt"
      - "indeterminate_order_10_v26.txt"
      - "indeterminate_order_10_v27.txt"
      - "research/order10_v27_two_p3_o11/**"
      - "indeterminate_order_10.txt"
      - "indeterminate_order_9_v9.txt"
      - "indeterminate_order_9.txt"
      - ".github/workflows/order10-v26-six-p3-octahedra.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positive-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - name: Replay five immutable complete P3-to-Od maps and sixth full P3 bijection
        run: |
          python -m research.order10_overcap_p3_coaffine_v1.verify_positives > "$RUNNER_TEMP/positive.log"
          test "$(grep -c '^REPLAY CERTIFIED:' "$RUNNER_TEMP/positive.log")" -eq 5
          tail -n 9 "$RUNNER_TEMP/positive.log"
      - name: Replay frozen historical v25-to-v26 positive census transition
        run: |
          python -m research.order10_v27_two_p3_o11.replay_v26 > "$RUNNER_TEMP/v26.log" 2>&1
          grep -q '^PASS: immutable ten-v26 six-positive proof' "$RUNNER_TEMP/v26.log"
          tail -n 12 "$RUNNER_TEMP/v26.log"
      - name: No optimized execution may bypass proof assertions
        run: |
          set -euo pipefail
          if python -O -m research.order10_v26_six_p3_octahedral.verify > "$RUNNER_TEMP/optimized.log" 2>&1; then
            echo "The optimized verifier unexpectedly succeeded"; exit 1
          fi
          grep -q 'Do not optimize away census certification assertions' "$RUNNER_TEMP/optimized.log"

  adversarial-census-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - name: Audit current v27 root after independent historical v26 proof replay
        run: |
          python -m compileall -q research/order10_v26_six_p3_octahedral
          python -m unittest discover -s tests -p test_current_root_index.py -v
