name: Verify snub divergence promotion v3/v11

on:
  push:
    paths:
      - "research/snub_promotion_v1/**"
      - "indeterminate_order_9*"
      - "indeterminate_order_10*"
      - "research/snub_promotion_v1/test_verify.py"
      - ".github/workflows/snub-promotion-v3-v11.yml"
  pull_request:
    paths:
      - "research/snub_promotion_v1/**"
      - "indeterminate_order_9*"
      - "indeterminate_order_10*"
      - "research/snub_promotion_v1/test_verify.py"
      - ".github/workflows/snub-promotion-v3-v11.yml"
  workflow_dispatch:

jobs:
  independent-snub-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent verifier dependency
        run: python -m pip install networkx==3.6.1
      - name: Check source hashes, index transitions and all positive proofs
        run: python research/snub_promotion_v1/verify.py
      - name: Regression and negative-case tests
        run: python -m unittest discover -s research/snub_promotion_v1 -p test_verify.py -v
