name: Certify order-nine v2 index and original McKay identities
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-nine-current-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned graph library
        run: python -m pip install networkx==3.6.1
      - name: Independently replay five archived certificates and verify all 49 McKay identities
        run: python research/snub_promotion_v1/replay_historical.py --order 9
      - name: Protect all historic stage and proof inputs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git hash-object indeterminate_order_9_v1.txt)" = "4f210949dad5e7350fc0185c34738e2bf46f9012"
          test "$(git hash-object indeterminate_order_9_v3.txt)" = "446cbb0be5f40b6014cdb530b1a314de95ff72b2"
          # Current nine-vertex root is certified v9. Protect frozen v4/v5/v6/v7/v8
          # and check that the mutable root matches v9.
          test "$(git hash-object indeterminate_order_9_v4.txt)" = "9055247c5778091c07717fde17c68ee207764621"
          test "$(git hash-object indeterminate_order_9_v5.txt)" = "d803ee83273b44f60e5078b7beb3d11a3f4eb2ee"
          test "$(git hash-object indeterminate_order_9_v6.txt)" = "48ed753696a2ff3e509c11fc550c64ddb500d675"
          test "$(git hash-object indeterminate_order_9_v7.txt)" = "6f1e05d6b6bb0f1b4f2638ad73a7163f26ab0345"
          test "$(git hash-object indeterminate_order_9_v8.txt)" = "446d7ddba6bdb7f4738730f7de0386bea6546df7"
          cmp indeterminate_order_9.txt indeterminate_order_9_v9.txt
          git diff --exit-code "$BASE_SHA" HEAD -- \
            runs/ reports/ historical/ history/ config/ postpasses/ \
            scripts/core9_o4_divergence_v1.py \
            scripts/core9_242316_o5_divergence_v1.py \
            scripts/core9_252075_o6_divergence_v1.py \
            scripts/order10_four_o4_lift_v1.py \
            research/order9_242316_o5_divergence_v1/ \
            research/order9_252075_o6_divergence_v1/ \
            research/order9_heher_o4_divergence_v1/ \
            research/order10_four_o4_lift_v1/
