name: Screen all ten-v28 stiff originals against certified small divergent retracts

on:
  pull_request:
    paths:
      - "research/order10_v28_broad_small_targets_v1/**"
      - "indeterminate_order_10_v28.txt"
      - ".github/workflows/order10-v28-broad-small-targets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-small-target-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - name: Enumerate exact induced divergent targets and ordinary retractions
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -m research.order10_v28_broad_small_targets_v1.search \
            --shard "$SHARD" \
            --output "$RUNNER_TEMP/small-target-shard-$SHARD.json" \
            | tee "$RUNNER_TEMP/discovery.log"
          grep -q '^PASS: exact small-target retraction pilot' "$RUNNER_TEMP/discovery.log"
      - uses: actions/upload-artifact@v4
        with:
          name: ten-v28-broad-small-target-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/small-target-shard-${{ matrix.shard }}.json
          retention-days: 90
          if-no-files-found: error

  positive-map-independent-aggregate:
    needs: independent-small-target-shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - uses: actions/download-artifact@v4
        with:
          pattern: ten-v28-broad-small-target-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Verify all 613 original identities and all positive source-edge maps
        run: |
          python -m research.order10_v28_broad_small_targets_v1.verify \
            --directory "$RUNNER_TEMP/shards" \
            --output "$RUNNER_TEMP/independent-small-target-proof.json" \
            | tee "$RUNNER_TEMP/aggregate.log"
          grep -q '^PASS: every archived positive small-target retract' "$RUNNER_TEMP/aggregate.log"
      - uses: actions/upload-artifact@v4
        with:
          name: ten-v28-small-target-positive-retractions-audited
          path: ${{ runner.temp }}/independent-small-target-proof.json
          retention-days: 90
          if-no-files-found: error

  positive-logic-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - name: Check every target theorem and adversarial finite graph
        run: |
          python -m compileall -q research/order10_v28_broad_small_targets_v1
          python -m unittest research.order10_v28_broad_small_targets_v1.test_verify -v
      - name: Reject optimized proof execution
        run: |
          set -euo pipefail
          if python -O -m research.order10_v28_broad_small_targets_v1.verify \
             --directory /tmp --output /tmp/forbidden.json > "$RUNNER_TEMP/opt.log" 2>&1; then
            echo "Optimized positive verifier unexpectedly ran"; exit 1
          fi
          grep -q 'Cannot optimize away positive graph-retraction checks' "$RUNNER_TEMP/opt.log"
