name: Recheck historical fourth-iterate v12 proofs under current root
on:
  pull_request:
    paths:
      - "research/order10_fourth_oct_v1/**"
      - "research/order10_o12_dim_v13/replay_v12.py"
      - "research/order9_p2_iso_lift_v1/replay_old_snub.py"
      - "indeterminate_order_10_v11.txt"
      - "indeterminate_order_10_v12.txt"
      - "indeterminate_order_10_v13.txt"
      - "indeterminate_order_10_v14.txt"
      - "indeterminate_order_9_v4.txt"
      - "indeterminate_order_9.txt"
      - "indeterminate_order_10.txt"
      - "tests/test_current_root_index.py"
      - ".github/workflows/order10-fourth-v12-proofs.yml"
  push:
    paths:
      - "research/order10_fourth_oct_v1/**"
      - "indeterminate_order_10_v11.txt"
      - "indeterminate_order_10_v12.txt"
      - "indeterminate_order_10_v13.txt"
      - "indeterminate_order_10_v14.txt"
      - "indeterminate_order_9_v4.txt"
      - "indeterminate_order_9.txt"
      - "indeterminate_order_10.txt"
      - ".github/workflows/order10-fourth-v12-proofs.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independently-replay-all-42:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent and pycliques verifiers
        run: |
          python -m pip install networkx==3.6.1
          git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project
          git -C /tmp/pycliques-project checkout --quiet 7ae36ffe67fb2e9bbafc68e97347aabcf757c2dc
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Verify current-root v14 invariant
        run: python -m unittest discover -s tests -p test_current_root_index.py -v
      - name: Verify O6 and O12 full maps and exact 38-member isomorphism lifts
        run: python -m research.order10_o12_dim_v13.replay_v12
      - name: Verify archived snub proof still replays at historical v11
        run: python -m research.order9_p2_iso_lift_v1.replay_old_snub --tests
