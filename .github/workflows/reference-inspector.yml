name: Public reference and certificate inspector

on:
  pull_request:
    paths:
      - "research/reference_inspector_v1/**"
      - ".github/workflows/reference-inspector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Public API
            revision: 0eb99d94d422f86c4e7a782f425c7a88a47c0c56
            selection: "--proved-only"
          - name: Historical v3 pin
            revision: d6753ac445b57740d90997008aa96830d4fc117c
            selection: ""
    name: Replay on ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: ${{ matrix.revision }}
          path: .deps/pycliques-project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .deps/pycliques-project/packages/pycliques
      - run: python -m unittest discover -s research/reference_inspector_v1
      - name: Replay a convergence certificate through its third iterate
        run: >-
          python research/reference_inspector_v1/inspect_certificate.py 'ICvbvy}|g'
          ${{ matrix.selection }} --verify-chain --require-proof
