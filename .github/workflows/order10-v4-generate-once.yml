# One-time deterministic output generation by GitHub Actions, restricted
# to this repository's exact research branch. Removes itself with the outputs.
name: Generate certified order-10 v4 index once

on:
  pull_request:
    paths:
      - ".github/workflows/order10-v4-generate-once.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/order10-current-status-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Generate exact v4 data with Python standard library only
        run: |
          python3 scripts/current_indeterminate_v4.py build
          python3 scripts/current_indeterminate_v4.py verify
          python3 -m unittest discover -s tests -p 'test_current_indeterminate_v4.py' -v
      - name: Commit three v4 artifacts and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indeterminate_order_10_v4.txt research/order10_current_indeterminates_v4/
          git rm .github/workflows/order10-v4-generate-once.yml
          git commit -m 'Commit certified 300-positive current order-10 index, leaving 8233 unresolved'
          git push origin HEAD:research/order10-current-status-v4
