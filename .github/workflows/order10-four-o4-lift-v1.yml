name: Certify 192 additional order-ten O4 divergences

on:
  pull_request:
    paths:
      - "scripts/order10_four_o4_lift_v1.py"
      - "tests/test_order10_four_o4_lift_v1.py"
      - "indeterminate_order_10_v7.txt"
      - "indeterminate_order_10_v8.txt"
      - "indeterminate_order_10.txt"
      - "research/order10_four_o4_lift_v1/**"
      - ".github/workflows/order10-four-o4-lift-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-four-core-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standalone graph dependency
        run: python -m pip install "networkx==3.6.1"
      - name: Replay exact two-core O4 morphisms and certify 147 strings and 192 indices
        run: |
          python scripts/order10_four_o4_lift_v1.py verify
          python scripts/order10_four_o4_lift_v1.py certificates --output /tmp/four-o4-certificates.json
          python -m unittest discover -s tests -p test_order10_four_o4_lift_v1.py -v
          python -m unittest discover -s tests -p test_current_root_index.py -v
          python scripts/heher_divergence_class_lift_v1.py verify
      - name: Protect immutable census stages and versioned v7
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASE_SHA" HEAD -- runs/ reports/ postpasses/ \
            indeterminate_order_9.txt indeterminate_order_10_v3.txt \
            indeterminate_order_10_v4.txt indeterminate_order_10_v5.txt \
            indeterminate_order_10_v6.txt indeterminate_order_10_v7.txt historical/
      - uses: actions/upload-artifact@v4
        with:
          name: certified-192-order10-O4-retractions
          path: /tmp/four-o4-certificates.json
          if-no-files-found: error
