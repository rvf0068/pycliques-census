name: Exhaustive nine-v7 P3 special-octahedron and snub-retraction exclusions

on:
  pull_request:
    paths:
      - "indeterminate_order_9_v7.txt"
      - "research/order9_v7_p3_special_negative_v1/**"
      - ".github/workflows/order9-v7-p3-special-negative.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-networkx:
    name: Enumerate every maximal clique and antipode assignment for all six P3 cores
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent NetworkX
        run: python -m pip install networkx==3.6.1
      - name: Rebuild six graphs and replay complete finite exclusion
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile research/order9_v7_p3_special_negative_v1/verify.py research/order9_v7_p3_special_negative_v1/snub.py
          python research/order9_v7_p3_special_negative_v1/verify.py
          python -m research.order9_v7_p3_special_negative_v1.snub --networkx-crosscheck
      - name: Fail on unexpected optimized Python bypass outcome
        run: |
          stdout_file=$(mktemp)
          stderr_file=$(mktemp)
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT
          if python -O research/order9_v7_p3_special_negative_v1/verify.py >"$stdout_file" 2>"$stderr_file"; then
            echo "ERROR: optimized verification unexpectedly passed"
            exit 1
          else
            status=$?
          fi
          if [ "$status" -ne 1 ] || ! grep -Fxq 'RuntimeError: Optimized Python bypasses proof-critical assertions' "$stderr_file"; then
            echo "ERROR: unexpected optimized verifier failure ($status)"
            cat "$stdout_file"
            cat "$stderr_file" >&2
            exit 1
          fi

  public-pycliques:
    name: Cross-check all six P3 exclusions with pinned public special-octahedron search
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: d140bd3a666ca6abf77e5823740ecef85e75a842
          path: pycliques-dependency
          persist-credentials: false
      - name: Install frozen public pycliques
        run: |
          python -m pip install networkx==3.6.1
          python -m pip install ./pycliques-dependency/packages/pycliques
      - name: Replay all six negative results with separate public algorithm
        env:
          PYTHONHASHSEED: "0"
        run: python research/order9_v7_p3_special_negative_v1/verify.py --public

  independent-cpp-snub:
    name: C++17 independent exhaustion of all 85,147 induced snub targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Compile distinct C++17 induced-subgraph and obstruction verifier
        run: |
          mkdir -p /tmp/snub-v7
          c++ -O3 -std=c++17 -Wall -Wextra -Werror \
            research/order9_v7_p3_special_negative_v1/snub_native.cpp \
            -o /tmp/snub-v7/snub_native
      - name: Rebuild six P3 hosts independently and export exact integer edges
        env:
          PYTHONHASHSEED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path
          from research.order9_v7_p3_special_negative_v1.verify import (
              SOURCES, frozen_rows, source_p3
          )
          from research.order9_v7_p3_special_negative_v1.snub import SNUB, PATTERN
          frozen_rows()
          assert tuple(PATTERN[v] for v in range(8)) == (
              116, 216, 177, 226, 199, 205, 59, 62
          )
          out = Path("/tmp/snub-v7")
          for index, g6 in SOURCES.items():
              g = source_p3(g6)
              nodes = sorted(g)
              positions = {v: i for i, v in enumerate(nodes)}
              rows = [f"{len(g)} {g.number_of_edges()}"]
              rows.extend(
                  f"{positions[u]} {positions[v]}" for u, v in g.edges()
              )
              (out / f"{index}.txt").write_text("\n".join(rows) + "\n")
          g = SNUB
          rows = [f"{len(g)} {g.number_of_edges()}"]
          rows.extend(f"{u} {v}" for u, v in g.edges())
          (out / "selftest.txt").write_text("\n".join(rows) + "\n")
          PY
      - name: Check exact independent C++ proof counts
        run: |
          test "$(/tmp/snub-v7/snub_native /tmp/snub-v7/selftest.txt)" = \
            "EXHAUSTED 1 8 0 1"
          for entry in \
            249576:13902 251628:26406 251759:1864 \
            251902:300 254369:172 260040:42503; do
            IFS=: read -r index expected <<< "$entry"
            got=$(/tmp/snub-v7/snub_native "/tmp/snub-v7/$index.txt")
            echo "McKay $index: $got"
            test "$got" = "EXHAUSTED $expected $((8 * expected)) $expected 0"
          done
