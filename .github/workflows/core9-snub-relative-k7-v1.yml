name: Prove K fold preservation, two-complete ear lemma and relative K7

on:
  pull_request:
    paths:
      - "scripts/core9_snub_relative_k7_v1.py"
      - "scripts/core9_snub_relative_k6_v1.py"
      - "scripts/core9_snub_relative_k5_v1.py"
      - "scripts/core9_snub_handle_iterates_v1.py"
      - "tests/test_core9_snub_relative_k7_v1.py"
      - "research/snub_handle_relative_k7_v1.md"
      - "research/order9_snub_handle_iterates_v1/**"
      - "README.md"
      - ".github/workflows/core9-snub-relative-k7-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-fold-ear-and-seventh-iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore frozen pre-v3 working index for historical replay
        run: cp historical/indeterminate_order_10_pre_v3.txt indeterminate_order_10.txt
      - uses: astral-sh/setup-uv@v4
      - name: Bootstrap pinned historical code
        run: bash scripts/bootstrap_special_k3_v5.sh
      - name: Independently replay prior sixth-iterate theorem
        run: |
          .venv-special-k3-v5/bin/python scripts/core9_snub_relative_k6_v1.py verify
      - name: Check new symbolic seventh-iterate transfer
        run: |
          .venv-special-k3-v5/bin/python scripts/core9_snub_relative_k7_v1.py verify
          .venv-special-k3-v5/bin/python scripts/core9_snub_relative_k7_v1.py json
      - name: Independently test domination lifting and all ear cases
        run: |
          .venv-special-k3-v5/bin/python -m unittest discover \
            -s tests -p 'test_core9_snub_relative_k7_v1.py' -v
      - name: Preserve all old proof sources, certificates and verdicts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git hash-object indeterminate_order_9_v1.txt)" = "4f210949dad5e7350fc0185c34738e2bf46f9012"
          git diff --exit-code "$BASE_SHA" HEAD -- \
            runs/ reports/ postpasses/ \
            research/order9_snub_retractions_v2/ \
            research/order9_snub_handle_iterates_v1/ \
            research/snub_handle_relative_k5_v1.md \
            research/snub_handle_relative_k6_v1.md \
            scripts/core9_snub_handle_iterates_v1.py \
            scripts/core9_snub_relative_k5_v1.py \
            scripts/core9_snub_relative_k6_v1.py \
            indeterminate_order_10_v3.txt \
            indeterminate_order_10_v3.txt indeterminate_order_10_v4.txt
