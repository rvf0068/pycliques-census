name: Certify three ten-v24 exact P4 O12 divergences

on:
  pull_request:
    paths:
      - "indeterminate_order_10_v23.txt"
      - "indeterminate_order_10_v24.txt"
      - "indeterminate_order_10.txt"
      - "indeterminate_order_10_v25.txt"
      - "research/order10_p4_o12_lifts_v24/**"
      - "tests/test_current_root_index.py"
      - ".github/workflows/order10-p4-o12-lifts-v24.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-three:
    name: Independently verify three exact P4 isomorphisms and ten-v24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Reconstruct four clique stages with independent maximal cliques
        run: |
          test -s research/order10_p4_o12_lifts_v24/certificates.json
          python -m py_compile research/order10_p4_o12_lifts_v24/verify.py
          python -m research.order10_p4_crossdepth_o15_v25.replay_v24 v24_lifts
          python -m unittest discover -s tests -p test_current_root_index.py -v
      - name: Reject optimized execution that would bypass proof checks
        run: |
          if python -O -m research.order10_p4_o12_lifts_v24.verify > /tmp/v24-opt.txt 2>&1; then
            echo "ERROR: optimized proof unexpectedly passed"
            exit 1
          fi
          grep -Fq 'RuntimeError: Optimized Python bypasses positive-certificate checks' /tmp/v24-opt.txt

  reproduce-divergent-o12-source:
    name: Replay the complete original O12 retraction onto the certified target
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the historical pinned pycliques reference implementation
        run: |
          python -m pip install networkx==3.6.1
          git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project
          git -C /tmp/pycliques-project checkout --quiet 7ae36ffe67fb2e9bbafc68e97347aabcf757c2dc
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Independently check the published O12 projection and three transported total maps
        run: |
          python research/order10_fourth_oct_v1/verify_o12.py
          python -m research.order10_p4_crossdepth_o15_v25.replay_v24 v24_transport
