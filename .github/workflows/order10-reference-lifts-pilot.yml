name: Pilot exact reference lifts into unresolved order-ten census

on:
  push:
    branches:
      - research/order10-reference-lifts-pilot
    paths:
      - "research/order10_reference_lifts_pilot/**"
      - ".github/workflows/order10-reference-lifts-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-p2:
    name: Positive-only P2 exact isomorphism search (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install version-pinned public pycliques
        run: |
          python -m pip install networkx==3.6.1
          git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project
          git -C /tmp/pycliques-project checkout --quiet 782deb653b8748e1b5759389cdd2134beac69351
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Check v14 unresolved against independently certified divergent references
        env:
          PYTHONHASHSEED: "0"
        run: |
          python research/order10_reference_lifts_pilot/screen.py \
            --depth 2 --shard ${{ matrix.shard }} --shards 8 --bound 1500 \
            --output "${{ runner.temp }}/exact-p2-shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: exact-p2-reference-lifts-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/exact-p2-shard-${{ matrix.shard }}.json
