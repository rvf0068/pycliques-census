name: Replay historical nine-v8 and ten-v19 residual census (5 and 1531)

on:
  pull_request:
    paths:
      - "indeterminate_order_9.txt"
      - "indeterminate_order_9_v7.txt"
      - "indeterminate_order_9_v8.txt"
      - "indeterminate_order_10.txt"
      - "indeterminate_order_10_v18.txt"
      - "indeterminate_order_10_v19.txt"
      - "research/order9_v8_order10_v19/**"
      - "research/order9_251902_p4_o17_v1/**"
      - "tests/test_current_root_index.py"
      - ".github/workflows/order9-v8-order10-v19.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-exact-promotion:
    name: Recompute all 150 9-core isomorphisms and immutable v7/v18-to-v8/v19 delta
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Exact promotion audit and current-root historical regressions
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile research/order9_v8_order10_v19/verify.py research/order9_v9_order10_v20/replay_v19.py research/order9_v8_order10_v19/replay_v18.py
          python -m research.order9_v9_order10_v20.replay_v19
          python -m unittest discover -s tests -p test_current_root_index.py -v
      - name: Reject optimized verifier and unrelated failures
        run: |
          stdout_file=$(mktemp)
          stderr_file=$(mktemp)
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT
          if python -O -m research.order9_v9_order10_v20.replay_v19 >"$stdout_file" 2>"$stderr_file"; then
            echo "ERROR: optimized verification unexpectedly succeeded"
            exit 1
          else
            status=$?
          fi
          if [ "$status" -ne 1 ] || ! grep -Fxq 'RuntimeError: Optimized Python bypasses proof-critical assertions' "$stderr_file"; then
            echo "ERROR: unrelated optimized verifier failure ($status)"
            cat "$stdout_file"
            cat "$stderr_file" >&2
            exit 1
          fi

  independently-replay-O17:
    name: Complete independent 461-image O17 retraction and exact 150 lift replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Reconstruct original from graph6, reverify all maps, and audit delta
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order9_v9_order10_v20.replay_v19 --proofs

  historical-v18:
    name: Replay original nine-v7 / ten-v18 exhaustive promotion with immutable source inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Run historical nine-v7 ten-v18 certification against pinned snapshots
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order9_v8_order10_v19.replay_v18

  public-O17:
    name: Public pycliques independent complete O17 retraction replay
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: d140bd3a666ca6abf77e5823740ecef85e75a842
          path: pycliques-dependency
          persist-credentials: false
      - run: |
          python -m pip install networkx==3.6.1
          python -m pip install ./pycliques-dependency/packages/pycliques
      - name: Independently verify O17 projection with public pycliques
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order9_v9_order10_v20.replay_v19 --proofs --public
