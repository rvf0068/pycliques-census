name: Certify 27 additional order-ten P2 lifts and v15 index

on:
  pull_request:
    paths:
      - "research/order10_reference_lifts_pilot/**"
      - "indeterminate_order_10_v14.txt"
      - "indeterminate_order_10_v15.txt"
      - "indeterminate_order_10.txt"
      - "indeterminate_order_10_v16.txt"
      - "indeterminate_order_9.txt"
      - "indeterminate_order_9_v5.txt"
      - "research/order10_current_indeterminates_v16/**"
      - "tests/test_current_root_index.py"
      - ".github/workflows/order10-reference-lifts-v15.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-networkx:
    name: Independent adjacency-proof and exact 27-deletion audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent graph verifier
        run: python -m pip install networkx==3.6.1
      - name: Fail fast on verifier syntax errors
        run: python -m py_compile research/order10_reference_lifts_pilot/verify.py
      - name: Check all saved P2 maps and immutable v14 to v15 transition
        run: python -m research.order10_current_indeterminates_v16.replay_v15

  public-pycliques-positive-replay:
    name: Verify 27 positives with public pycliques and replay historical v14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install version-pinned public pycliques
        run: |
          python -m pip install networkx==3.6.1
          git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project
          git -C /tmp/pycliques-project checkout --quiet 782deb653b8748e1b5759389cdd2134beac69351
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Verify each of the 27 positives with public pycliques
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m research.order10_current_indeterminates_v16.replay_v15 --public
          python -m unittest discover -s tests -p test_current_root_index.py -v
      - name: Replay immutable historical v4/v14 proof under v16
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order10_current_indeterminates_v16.replay_v14

  public-pycliques-exhaustive-screen:
    name: Full unbounded P2 screen (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install version-pinned public pycliques
        run: |
          python -m pip install networkx==3.6.1
          git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project
          git -C /tmp/pycliques-project checkout --quiet 782deb653b8748e1b5759389cdd2134beac69351
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Verify complete disjoint shard without a clique bound
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m research.order10_current_indeterminates_v16.replay_v15 \
            --full --shard ${{ matrix.shard }} --shards 8
