name: Current order-10 unresolved index consistency

on:
  pull_request:
    paths:
      - "indeterminate_order_10.txt"
      - "indeterminate_order_10_v6.txt"
      - "indeterminate_order_10_v7.txt"
      - "indeterminate_order_10_v8.txt"
      - "indeterminate_order_10_v9.txt"
      - "indeterminate_order_10_v10.txt"
      - "indeterminate_order_10_v21.txt"
      - "indeterminate_order_10_v22.txt"
      - "indeterminate_order_10_v23.txt"
      - "indeterminate_order_10_v24.txt"
      - "indeterminate_order_10_v25.txt"
      - "historical/indeterminate_order_10_pre_v3.txt"
      - "tests/test_current_root_index.py"
      - ".github/workflows/current-root-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-current-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Verify current nine-v10 and ten-v30 roots with immutable earlier source
        run: python -m unittest discover -s tests -p test_current_root_index.py -v
