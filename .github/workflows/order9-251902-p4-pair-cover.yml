name: Certify McKay 251902 P4 pair-cover dual excluding ordinary O5 retractions

on:
  pull_request:
    paths:
      - "indeterminate_order_9_v7.txt"
      - "research/order9_p4_domination_dual_v1/**"
      - "research/order9_251902_p4_pair_cover_dual_v1/**"
      - ".github/workflows/order9-251902-p4-pair-cover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-edge-pair-dual:
    name: Reconstruct P4 and verify every one of 11,388 complement-edge inequalities
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx==3.6.1
      - name: Exact integer weight and immutable P4 graph proof replay
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile research/order9_251902_p4_pair_cover_dual_v1/verify.py
          python -m research.order9_251902_p4_pair_cover_dual_v1.verify
      - name: Fail closed on optimized verification bypass
        run: |
          stdout_file=$(mktemp)
          stderr_file=$(mktemp)
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT
          if python -O -m research.order9_251902_p4_pair_cover_dual_v1.verify >"$stdout_file" 2>"$stderr_file"; then
            echo "ERROR: optimized verifier unexpectedly succeeded"
            exit 1
          else
            status=$?
          fi
          if [ "$status" -ne 1 ] || ! grep -Fxq 'RuntimeError: Optimized Python bypasses proof-critical assertions' "$stderr_file"; then
            echo "ERROR: unrelated optimized verifier failure ($status)"
            cat "$stdout_file"
            cat "$stderr_file" >&2
            exit 1
          fi

  public-pycliques-replay:
    name: Public-pycliques four-stage P4 reconstruction and independent exact dual replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: d140bd3a666ca6abf77e5823740ecef85e75a842
          path: pycliques-dependency
          persist-credentials: false
      - run: |
          python -m pip install networkx==3.6.1
          python -m pip install ./pycliques-dependency/packages/pycliques
      - name: Stage-by-stage public clique graph, public paring and integer dual proof
        env:
          PYTHONHASHSEED: "0"
        run: python -m research.order9_251902_p4_pair_cover_dual_v1.verify --public
