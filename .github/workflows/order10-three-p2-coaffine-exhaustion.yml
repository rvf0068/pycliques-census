name: Exact P2 coaffine endomorphism exhaustion on four oversized P3 sources

on:
  pull_request:
    paths:
      - "research/order10_three_p2_coaffine_exhaustion_v1/**"
      - "research/order10_11713984_coaffine_retract_v1/**"
      - "research/order10_p3_global_v23_index/**"
      - "research/order10_five_p3_native_v1/search.py"
      - "research/order10_five_p3_native_v1/constraints.txt"
      - "indeterminate_order_10_v28.txt"
      - "indeterminate_order_10_v27.txt"
      - ".github/workflows/order10-three-p2-coaffine-exhaustion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive-both-official-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin the already merged public pycliques solver implementation
        uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: e27649a6898b8c5b5bdbb4c6c64fd792672ae0ae
          path: monorepo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked Python and official pycliques package
        run: |
          python -m pip install -r research/order10_five_p3_native_v1/constraints.txt
          python -m pip install -c research/order10_five_p3_native_v1/constraints.txt "./monorepo/packages/pycliques"
          python -m pip check
      - name: Verify source and build existing C++17 solver
        run: |
          set -euo pipefail
          SHA="$(git -C monorepo rev-parse HEAD)"
          test "$SHA" = e27649a6898b8c5b5bdbb4c6c64fd792672ae0ae
          echo "PYCLIQUES_PINNED_SHA=$SHA" >> "$GITHUB_ENV"
          python -m pycliques.octahedral_coaffine_native --build
      - name: Full source authentication and independent Python/native exhaustions
        run: |
          python -m research.order10_three_p2_coaffine_exhaustion_v1.verify \
            --backend-scope both \
            --output "$RUNNER_TEMP/four-p2-exhaustive.json" \
            | tee "$RUNNER_TEMP/exhaustion.log"
          grep -q '^PASS: exact P2 coaffine endomorphism exhaustion' "$RUNNER_TEMP/exhaustion.log"
      - name: Regression checks and positive P3 contrast
        run: |
          python -m compileall -q research/order10_three_p2_coaffine_exhaustion_v1
          python -m unittest research.order10_three_p2_coaffine_exhaustion_v1.test_verify -v
          python -m research.order10_11713984_coaffine_retract_v1.verify > "$RUNNER_TEMP/positive-P3.log"
          grep -q '^PASS: original McKay 11713984 K-divergent' "$RUNNER_TEMP/positive-P3.log"
      - name: Optimized Python must not bypass proof assertions
        run: |
          if python -O -m research.order10_three_p2_coaffine_exhaustion_v1.verify --backend-scope python \
             --output "$RUNNER_TEMP/optimized.json" > "$RUNNER_TEMP/optimized.log" 2>&1; then
            echo "Optimized proof unexpectedly succeeded"; exit 1
          fi
          grep -q 'Do not optimize away coaffine exhaustion checks' "$RUNNER_TEMP/optimized.log"
      - uses: actions/upload-artifact@v4
        with:
          name: four-p2-exact-coaffine-absence
          path: ${{ runner.temp }}/four-p2-exhaustive.json
          retention-days: 90
          if-no-files-found: error
