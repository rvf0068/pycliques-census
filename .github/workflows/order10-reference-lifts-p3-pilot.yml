name: Pilot exact third-iterate reference lifts (positive-only)

on:
  push:
    branches:
      - research/order10-reference-lifts-pilot
    paths:
      - ".github/workflows/order10-reference-lifts-p3-pilot.yml"
      - "research/order10_reference_lifts_pilot/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-p3:
    name: Exact P3 isomorphism search (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install version-pinned public pycliques
        run: |
          python -m pip install networkx==3.6.1
          git clone --quiet https://github.com/rvf0068/pycliques-project.git /tmp/pycliques-project
          git -C /tmp/pycliques-project checkout --quiet 782deb653b8748e1b5759389cdd2134beac69351
          python -m pip install /tmp/pycliques-project/packages/pycliques
      - name: Positive-only third-pared-iterate exact reference scan
        env:
          PYTHONHASHSEED: "0"
        run: |
          python research/order10_reference_lifts_pilot/screen.py \
            --depth 3 --shard ${{ matrix.shard }} --shards 8 --bound 1500 \
            --output "${{ runner.temp }}/exact-p3-shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: exact-p3-reference-lifts-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/exact-p3-shard-${{ matrix.shard }}.json
