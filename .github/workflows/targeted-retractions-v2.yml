name: Divergent-target cached retraction v2

on:
  pull_request:
    paths:
      - "scripts/targeted_retractions_v2.py"
      - "scripts/bootstrap_targeted_v2.sh"
      - "config/pycliques_commit_targeted_v2.txt"
      - "tests/targeted_retractions_v2_cases.py"
      - ".github/workflows/targeted-retractions-v2.yml"
      - "README.md"
      - "indeterminate_order_9.txt"
      - "indeterminate_order_10.txt"
  workflow_dispatch:

jobs:
  targeted-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore frozen 54-case order-nine input for historical replay
        run: cp indeterminate_order_9_v1.txt indeterminate_order_9.txt
      - name: Restore frozen pre-v3 working index for historical replay
        run: cp historical/indeterminate_order_10_pre_v3.txt indeterminate_order_10.txt
      - uses: astral-sh/setup-uv@v4
      - name: Bootstrap independent v2 environment
        run: bash scripts/bootstrap_targeted_v2.sh
      - name: Install pytest for isolated tests
        run: uv pip install --python .venv-targeted-v2/bin/python pytest
      - name: Check manifest, cache, witnesses and excluded C6
        run: .venv-targeted-v2/bin/python -m pytest tests/targeted_retractions_v2_cases.py -v
      - name: Rerun order10 graph 2318241 with pinned corrected targets
        run: |
          .venv-targeted-v2/bin/python scripts/targeted_retractions_v2.py plan --order 10
          .venv-targeted-v2/bin/python scripts/targeted_retractions_v2.py next --order 10 --index 2318241
          .venv-targeted-v2/bin/python scripts/targeted_retractions_v2.py verify --order 10
          .venv-targeted-v2/bin/python - <<'PY'
          import json
          from pathlib import Path
          file = Path("runs/order10/targeted-retractions-v2/records/02318241.json")
          record = json.loads(file.read_text())
          assert record["index"] == 2318241
          assert record["status"] == "COMPLETED"
          assert record["levels"][1]["order"] == 16
          family = record["levels"][1]["families"]["cycle_complements"]
          assert family["status"] == "EXHAUSTED"
          assert family["induced_targets"] == 0
          for level in record["levels"]:
              if level["status"] != "COMPLETED":
                  continue
              for result in level["families"].values():
                  if result["status"] == "FOUND" and result["kind"].startswith("cycle_complements:"):
                      assert int(result["kind"].rsplit(":", 1)[1]) >= 8
          print("Validated complete v2 rerun of graph 2318241")
          PY
      - name: Small order10 v2 pilot
        run: |
          .venv-targeted-v2/bin/python scripts/targeted_retractions_v2.py next --order 10 --batch-size 2
          .venv-targeted-v2/bin/python scripts/targeted_retractions_v2.py verify --order 10
      - name: Protect historical census stages and original inputs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Allow the scoped v1 workflow adjustment for the new class-lift report.
          git diff --exit-code "$BASE_SHA" HEAD -- \
            runs/ reports/ \
            ':(exclude)reports/order10_special_octahedron_core_lift_v1/**' postpasses/ \
            config/pycliques_commit_targeted_v1.txt \
            scripts/targeted_retractions_v1.py \
            scripts/bootstrap_targeted_v1.sh \
            tests/targeted_retractions_v1_cases.py \
            indeterminate_order_10_v3.txt
      - name: Authenticate allowed v1 workflow guard change
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          workflow = ".github/workflows/targeted-retractions-v1.yml"
          original = subprocess.check_output(
              ["git", "show", f"{os.environ['BASE_SHA']}:{workflow}"], text=True
          )
          # The base v1 workflow already restores the frozen pre-v3
          # order-ten root. This one-to-one transformation is the ONLY
          # permitted change to that archived workflow.
          checkout = (
              "      - uses: actions/checkout@v4\n"
              "        with:\n"
              "          fetch-depth: 0\n"
          )
          nine_restore = (
              "      - name: Restore frozen 54-case order-nine input for historical replay\n"
              "        run: cp indeterminate_order_9_v1.txt indeterminate_order_9.txt\n"
          )
          original_guard = "            indeterminate_order_9.txt\n"
          archived_guard = "            indeterminate_order_10_v3.txt\n"
          assert original.count(checkout) == 1, "Unexpected checkout stanza"
          if (
              original.count(nine_restore) == 1
              and original.count(archived_guard) == 1
              and original_guard not in original
          ):
              # The archived v1 workflow on main is already transformed:
              # permit only exact preservation, not a second insertion.
              expected = original
          else:
              assert original.count(original_guard) == 1, "Unexpected v1 root guard"
              expected = (
                  original.replace(checkout, checkout + nine_restore, 1)
                  .replace(original_guard, archived_guard, 1)
              )
          assert Path(workflow).read_text() == expected, (
              "Historical targeted-retractions-v1 workflow deviates from its "
              "exact archived replay/guard transformation"
          )
          print("Verified exact v1 workflow replay restoration and history guard")
          PY
