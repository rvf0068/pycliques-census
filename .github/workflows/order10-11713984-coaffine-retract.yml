name: Exact K-divergence and fourth-iterate homology of 11713984

on:
  pull_request:
    paths:
      - "research/order10_11713984_coaffine_retract_v1/**"
      - "research/order10_p3_global_v23_index/independent_verify.py"
      - "indeterminate_order_10_v25.txt"
      - ".github/workflows/order10-11713984-coaffine-retract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-coaffine-divergence-and-homology-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install networkx==3.6.1
      - name: Independently check full native map and idempotent 14th power
        run: |
          python -m research.order10_11713984_coaffine_retract_v1.verify > "$RUNNER_TEMP/coaffine.log"
          grep -q '^PASS: original McKay 11713984 K-divergent' "$RUNNER_TEMP/coaffine.log"
          grep -q '"next_pared_iterate_minimum_vertices": 81920' "$RUNNER_TEMP/coaffine.log"
          grep -q '"original_K_divergent": true' "$RUNNER_TEMP/coaffine.log"
          tail -n 24 "$RUNNER_TEMP/coaffine.log"
      - name: Mutation tests for source graph and complete map
        run: |
          python -m compileall -q research/order10_11713984_coaffine_retract_v1
          python -m unittest research.order10_11713984_coaffine_retract_v1.test_verify -v
      - name: Reject optimized proof execution
        run: |
          if python -O -m research.order10_11713984_coaffine_retract_v1.verify > "$RUNNER_TEMP/opt.log" 2>&1; then
            echo "Optimized proof unexpectedly succeeded"; exit 1
          fi
          grep -q 'Proof assertions must not be optimized away' "$RUNNER_TEMP/opt.log"
